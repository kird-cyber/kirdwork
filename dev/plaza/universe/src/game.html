<style>

:root{

  color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#1B2F5C 0%,#0B1530 38%,var(--night) 75%) fixed,var(--night);color:#fff;font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:var(--body)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;display:grid;grid-template-columns:220px minmax(0,auto) 250px;gap:18px;justify-content:center;align-items:start;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px;min-height:100%;box-sizing:border-box}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.brand{font-family:var(--disp);font-size:30px;line-height:1;letter-spacing:.01em}
.brand em{font-style:normal;color:var(--gold)}
.brand small{display:block;font-family:var(--body);font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.06em;margin-top:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;backdrop-filter:blur(4px)}
.lab{font-size:12px;font-weight:900;color:var(--mute);letter-spacing:.06em}
.score{font-family:var(--disp);font-size:40px;line-height:1.05;color:#fff}
.best{font-family:var(--disp);font-size:28px;line-height:1.05;color:var(--gold)}
.newrec{display:inline-block;margin-left:6px;font-family:var(--body);font-size:11px;font-weight:900;background:var(--red);color:#fff;border-radius:6px;padding:1px 6px;vertical-align:middle}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:9px 10px;font-weight:900;font-size:14px;cursor:pointer}

.legend{display:flex;flex-direction:column;gap:2px}

.legend h2 small{font-family:var(--body);font-size:11.5px;font-weight:800;color:var(--mute);margin-left:6px}
.lg{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:8px;align-items:center;background:none;border:0;border-radius:10px;padding:3px 6px;color:#fff;cursor:pointer;text-align:left;width:100%}
.lg:hover{background:rgba(255,255,255,.06)}

.lg.top{background:rgba(255,210,74,.12);box-shadow:inset 0 0 0 2px rgba(255,210,74,.55)}
.lg .arrow{grid-column:1/-1;height:0}

.rbar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:5px}

.promo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:35;text-align:center;pointer-events:none;animation:pr 2.2s ease forwards}
.promo svg{width:120px;height:120px;filter:drop-shadow(0 0 24px var(--rk))}
.promo b{display:block;font-family:var(--disp);font-weight:400;font-size:40px;color:var(--rk);text-shadow:0 3px 0 #0E2238}
.promo small{display:block;font-weight:900;font-size:16px;color:#fff;text-shadow:0 2px 6px #000}
@keyframes pr{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}

.box .emb svg{width:132px;height:132px;display:block;margin:2px auto 0}

.box .rk-table td:first-child{display:flex;align-items:center;gap:8px}
.box .rk-table svg{width:30px;height:30px}
.ebar{height:12px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0}

.btn.hole{width:100%;background:#2A1E4A;color:#E7D2FF;border-color:#B07CF2}

.credit{font-size:10.5px;color:var(--mute);font-weight:600;line-height:1.5}

#modal{position:fixed;inset:0;z-index:30;background:rgba(3,6,16,.72);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow:auto}
.box{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;width:min(460px,100%);padding:18px 20px 20px;box-shadow:0 20px 50px rgba(0,0,0,.5);max-height:100%;overflow:auto;box-sizing:border-box;text-align:center}
.box h3{font-family:var(--disp);font-weight:400;font-size:30px;margin:4px 0 6px;line-height:1.15}
.box p{font-weight:700;line-height:1.6;margin:6px 0;color:#25344D}
.box .big{font-family:var(--disp);font-size:52px;line-height:1;color:var(--ink)}
.box .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.box .stat{display:flex;justify-content:center;gap:18px;margin:8px 0}

.box img.hero{width:110px;height:110px;margin:4px auto 0;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.box .fact{background:#E9F0FA;border-radius:12px;padding:10px 12px;font-size:13.5px;text-align:left}
.box .fact b{color:#1F6FB2}
.box .x{position:absolute}
.box table{width:100%;border-collapse:collapse;font-size:13.5px;text-align:left;margin-top:8px}
.box td{border-bottom:1px solid #D3DCE8;padding:6px 4px}
.box td:last-child{text-align:right;font-weight:800}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:40;max-width:min(92vw,520px);background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:9px 16px;font-weight:800;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.35);text-align:center}
@media (min-width:900px){#toast{top:auto;left:auto;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:none;max-width:260px;text-align:left}}

@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr);gap:10px;padding-block:8px 16px}
  .side.left{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr) auto;gap:6px;align-items:stretch}
  .next b{white-space:nowrap}.next{gap:6px}
  .side.left .brand{grid-column:1/-1;font-size:22px;display:flex;align-items:baseline;gap:8px}
  .side.left .brand small{margin:0}
  .side.left .card{padding:8px 10px}
  .score{font-size:26px}.best{font-size:22px}
  .next img{width:40px;height:40px}.next b{font-size:14px}.next small{display:none}
  .side.left .hint{display:none}
  .side.left .energyCard{grid-column:1/-1;order:7;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 10px}.energyCard .ebar{margin:0}.energyCard .btn.hole{width:auto;padding:6px 10px;font-size:12.5px}
  .side.left .rankCard{grid-column:1/-1;order:8;padding:6px 10px}.rankCard .lab{display:none}.rank svg{width:40px;height:40px}.rank b{font-size:17px}
  .side.left .themesCard{grid-column:1/-1;order:9;padding:6px 8px}.themesCard .lab{display:none}
  .themes{grid-template-columns:repeat(3,minmax(0,1fr))}.th{font-size:11.5px;padding:5px 6px;gap:5px}.th i{width:12px;height:12px}
  .btns{grid-template-columns:1fr;align-content:center}
  .btns .btn{padding:6px 8px;font-size:12.5px}
  .btns .full{display:none}
  .legend{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .legend h2{display:none}
  .lg{grid-template-columns:1fr;justify-items:center;width:auto;min-width:64px;padding:4px}
  .lg img{width:30px;height:30px}
  .lg b{font-size:11.5px;text-align:center}
  .lg small,.lg .p small{display:none}
  .lg .p{font-size:11px;text-align:center}
  .side.right .card{padding:8px}
}
</style>

const DIVS=['IV','III','II','I'];
function rankOf(sc){
  let i=0;for(let k=0;k<RANKS.length;k++)if(sc>=RANKS[k].min)i=k;
  const R=RANKS[i],hi=i+1<RANKS.length?RANKS[i+1].min:null;let d=-1,label=R.n,next=hi,nextLabel=hi?RANKS[i+1].n:'';
  if(R.div&&hi){const step=(hi-R.min)/4;d=Math.min(3,Math.floor((sc-R.min)/step));label=`${R.n} ${DIVS[d]}`;if(d<3){next=Math.round(R.min+step*(d+1));nextLabel=`${R.n} ${DIVS[d+1]}`}}
  const lo=d>=0?Math.round(R.min+(hi-R.min)/4*d):R.min;const pct=next?Math.min(1,(sc-lo)/(next-lo)):1;
  return{i,d,label,next,nextLabel,pct};
}

  return `<svg viewBox="0 0 100 100" role="img" aria-label="${R.n} 엠블럼"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".25" stop-color="${c}"/><stop offset="1" stop-color="${dk}"/></linearGradient></defs>${wings2}${wings}${crown}<path d="M50 14 L78 28 L78 58 Q78 78 50 90 Q22 78 22 58 L22 28Z" fill="url(#${id})" stroke="#0E2238" stroke-width="3" stroke-linejoin="round"/><path d="M50 22 L70 32 L70 57 Q70 72 50 81 Q30 72 30 57 L30 32Z" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.6"/><text x="50" y="63" text-anchor="middle" font-family="Black Han Sans,Noto Sans KR,sans-serif" font-size="30" fill="#0E2238">α</text>${gem}${i<4?stars:''}</svg>`;
}

function step(dt){
  const h=dt/SUB;const merges=[];
  const all=bodies;bodies=all.filter(b=>!b.suck);
  for(let s=0;s<SUB;s++){
    for(const b of bodies){b.vy+=GRAV*h;b.x+=b.vx*h;b.y+=b.vy*h}
    // 천체끼리
    for(let i=0;i<bodies.length;i++){const a=bodies[i];if(a.dead)continue;
      for(let j=i+1;j<bodies.length;j++){const b=bodies[j];if(b.dead)continue;
        const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r;if(Math.abs(dx)>rr||Math.abs(dy)>rr)continue;
        const d2=dx*dx+dy*dy;if(d2>=rr*rr)continue;
        const d=Math.sqrt(d2)||0.001,nx=dx/d,ny=dy/d,ov=rr-d;
        if(a.t===b.t)merges.push([a,b]);
        const ia=1/a.m,ib=1/b.m,sum=ia+ib;
        a.x-=nx*ov*ia/sum;a.y-=ny*ov*ia/sum;b.x+=nx*ov*ib/sum;b.y+=ny*ov*ib/sum;
        const rvx=b.vx-a.vx,rvy=b.vy-a.vy,vn=rvx*nx+rvy*ny;
        if(vn<0){const j=-(1+REST)*vn/sum;a.vx-=j*nx*ia;a.vy-=j*ny*ia;b.vx+=j*nx*ib;b.vy+=j*ny*ib;
          const tx=-ny,ty=nx,vt=rvx*tx+rvy*ty;let jt=-vt/sum;const lim=MU*j;jt=Math.max(-lim,Math.min(lim,jt));
          a.vx-=jt*tx*ia;a.vy-=jt*ty*ia;b.vx+=jt*tx*ib;b.vy+=jt*ty*ib}
      }}
    // 벽·바닥
    for(const b of bodies){
      if(b.x-b.r<X0){b.x=X0+b.r;if(b.vx<0)b.vx=-b.vx*REST;b.vy*=1-MU*0.08}
      if(b.x+b.r>X0+IW){b.x=X0+IW-b.r;if(b.vx>0)b.vx=-b.vx*REST;b.vy*=1-MU*0.08}
      if(b.y+b.r>FLOOR){b.y=FLOOR-b.r;if(b.vy>0)b.vy=-b.vy*REST;b.vx*=1-MU*0.1}
    }
  }

    if(b.st>=HOLE_MS&&!b.dead){b.dead=true;const v=Math.round((b.t+1)*500*(fever>0?2:1));score+=v;pop(b.x,b.y,v,'')}}
  bodies=all.filter(b=>!b.dead||b.suck);
  // 합치기: 먼저 닿은 쌍부터, 이미 쓰인 천체는 건너뜀
  for(const [a,b] of merges){if(a.dead||b.dead)continue;a.dead=b.dead=true;
    const x=(a.x*a.m+b.x*b.m)/(a.m+b.m),y=(a.y*a.m+b.y*b.m)/(a.m+b.m);
    combo=now-lastMerge<=COMBO_MS?combo+1:1;lastMerge=now;if(combo>maxCombo)maxCombo=combo;
    const mult=Math.min(COMBO_MAX,1+COMBO_STEP*(combo-1))*(fever>0?2:1);
    if(a.t===10){const v=Math.round(SUN_PAIR_PTS*(fever>0?2:1));score+=v;burst(x,y,10,true);pop(x,y,v,'쌍성 블랙홀');toast('두 태양이 블랙홀로! +'+fmt(v));sfx(12);energy=100;continue}
    const t=a.t+1;const nb=addBody(t,x,y,(a.vx+b.vx)/2,(a.vy+b.vy)/2);nb.born=now-GRACE_MS;

    if(t>=8)shake=6+t;
  }
  bodies=bodies.filter(b=>!b.dead);
  // 게임오버: 선 위에 1초 넘게
  if(fever>0)fever=Math.max(0,fever-dt*1000);

}
function drop(){

  lastDrop=now;curTier=nextTier;nextTier=randTier();renderNext();sfx(-1);

    ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;ctx.strokeRect(X0+1,TOP,IW-2,IH-1);
  }else if(th==='lab'){
    ctx.fillStyle='rgba(190,232,245,.35)';ctx.fillRect(L,TOP-14,WALL,IH+14);ctx.fillRect(Rr,TOP-14,WALL,IH+14);
    ctx.strokeStyle='rgba(225,248,255,.85)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(L+2,TOP-14);ctx.lineTo(L+2,B+WALL-2);ctx.lineTo(Rr+WALL-2,B+WALL-2);ctx.lineTo(Rr+WALL-2,TOP-14);ctx.stroke();
    ctx.beginPath();ctx.moveTo(X0,TOP-14);ctx.lineTo(X0,B);ctx.lineTo(Rr,B);ctx.lineTo(Rr,TOP-14);ctx.stroke();
    ctx.fillStyle='rgba(190,232,245,.35)';ctx.fillRect(L,B,WW,WALL);
    ctx.fillStyle='#6B4E2E';ctx.fillRect(L-6,B+WALL-4,WW+12,6);
    ctx.fillStyle='rgba(225,248,255,.9)';ctx.beginPath();ctx.moveTo(Rr+WALL-2,TOP-14);ctx.lineTo(Rr+WALL+10,TOP-24);ctx.lineTo(Rr+WALL+10,TOP-18);ctx.lineTo(Rr+WALL-2,TOP-6);ctx.fill();
  }else{
    const g=ctx.createLinearGradient(L,0,L+WALL,0);g.addColorStop(0,'#3A465C');g.addColorStop(.5,'#8A97AA');g.addColorStop(1,'#4A576E');
    ctx.fillStyle=g;ctx.fillRect(L,TOP-10,WALL,IH+WALL+10);const g2=ctx.createLinearGradient(Rr,0,Rr+WALL,0);g2.addColorStop(0,'#4A576E');g2.addColorStop(.5,'#8A97AA');g2.addColorStop(1,'#3A465C');ctx.fillStyle=g2;ctx.fillRect(Rr,TOP-10,WALL,IH+WALL+10);
    ctx.fillStyle='#5B6B82';ctx.fillRect(L,B,WW,WALL);
    ctx.save();ctx.beginPath();ctx.rect(L,B,WW,WALL);ctx.clip();ctx.fillStyle='#FFD24A';for(let x=L-30;x<L+WW;x+=28){ctx.beginPath();ctx.moveTo(x,B+WALL);ctx.lineTo(x+14,B);ctx.lineTo(x+24,B);ctx.lineTo(x+10,B+WALL);ctx.fill()}ctx.restore();
    ctx.fillStyle='#2A3346';for(let y=TOP+10;y<B;y+=46){for(const x of [L+WALL/2,Rr+WALL/2]){ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()}}
  }
  // 게임오버 선
  const danger=bodies.some(b=>b.overT>0);
  ctx.setLineDash([10,8]);ctx.lineWidth=2.5;ctx.strokeStyle=danger&&Math.sin(now/90)>0?'#FF5A47':'rgba(255,120,100,.75)';ctx.beginPath();ctx.moveTo(X0,LINE_Y);ctx.lineTo(X0+IW,LINE_Y);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,170,150,.9)';ctx.font='800 12px "Noto Sans KR",sans-serif';ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText(THEMES[th].line,X0+IW-8,LINE_Y-4);
  ctx.restore();
}
function drawBody(t,x,y,a,alpha=1){
  const r=R(t),im=SPR[t];ctx.save();ctx.globalAlpha=alpha;
  if(t===10){const g=ctx.createRadialGradient(x,y,r*.8,x,y,r*1.45);g.addColorStop(0,'rgba(255,200,80,.55)');g.addColorStop(1,'rgba(255,140,40,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*1.45,0,7);ctx.fill()}
  if(t===8){ctx.fillStyle='rgba(8,14,30,.6)';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
  ctx.translate(x,y);ctx.rotate(t===8?a*0.15:a);
  if(im.complete&&im.naturalWidth)ctx.drawImage(im,-r,-r,r*2,r*2);else{ctx.fillStyle=BODIES[t].rim;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill()}
  ctx.restore();ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=BODIES[t].rim;ctx.lineWidth=t<5?2.5:3.2;ctx.beginPath();ctx.arc(x,y,r-1.2,0,7);ctx.stroke();ctx.restore();
}
const ALPHA_SVG=(()=>{try{return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(avatar({name:'알파',color:'#2E86D6',acc:'orb'}))}catch(e){return ''}})();
const alphaImg=new Image();if(ALPHA_SVG)alphaImg.src=ALPHA_SVG;
function drawDropper(th){
  if(over)return;const r=R(curTier);const x=Math.max(X0+r,Math.min(X0+IW-r,X0+aimX));const ready=now-lastDrop>=COOLDOWN;
  ctx.save();
  if(th==='kird'){ if(alphaImg.complete&&alphaImg.naturalWidth)ctx.drawImage(alphaImg,x-r-58,HOLD_Y-34,52,52);ctx.strokeStyle='#8CC63F';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-r-12,HOLD_Y-6);ctx.quadraticCurveTo(x-r,HOLD_Y-r-6,x,HOLD_Y-r-4);ctx.stroke()}
  else if(th==='lab'){ctx.fillStyle='rgba(225,248,255,.55)';ctx.strokeStyle='rgba(225,248,255,.95)';ctx.lineWidth=2;rr(x-6,HOLD_Y-r-58,12,46,5);ctx.fill();ctx.stroke();ctx.fillStyle='#E0533F';ctx.beginPath();ctx.ellipse(x,HOLD_Y-r-62,13,10,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x-4,HOLD_Y-r-12);ctx.lineTo(x,HOLD_Y-r-2);ctx.lineTo(x+4,HOLD_Y-r-12);ctx.fill()}
  else{ctx.fillStyle='#8A97AA';ctx.fillRect(x-4,TIP_BAND,8,HOLD_Y-r-14-TIP_BAND);ctx.fillStyle='#5B6B82';rr(x-18,HOLD_Y-r-18,36,10,3);ctx.fill();ctx.strokeStyle='#C9D3E0';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-16,HOLD_Y-r-8);ctx.lineTo(x-r*.7-4,HOLD_Y-r*.3);ctx.moveTo(x+16,HOLD_Y-r-8);ctx.lineTo(x+r*.7+4,HOLD_Y-r*.3);ctx.stroke();ctx.fillStyle=ready?'#8CC63F':'#E0533F';ctx.beginPath();ctx.arc(x,HOLD_Y-r-13,3,0,7);ctx.fill()}
  drawBody(curTier,x,HOLD_Y,0,ready?1:.55);
  ctx.restore();
}
function render(){
  ctx.setTransform(SC*DPR,0,0,SC*DPR,0,0);ctx.clearRect(0,0,WW,WH);
  let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;shake*=.88;if(shake<.4)shake=0}
  ctx.translate(sx,sy);
  const th=SAVE.theme;drawBack(th);
  if(fever>0){ctx.save();ctx.globalAlpha=.18+.08*Math.sin(now/120);ctx.fillStyle='#B07CF2';ctx.fillRect(X0,TOP,IW,IH);ctx.restore()}
  for(const H of holes){const k=Math.min(1,H.t/200),fade=H.t>HOLE_MS?Math.max(0,1-(H.t-HOLE_MS)/500):1,rad=70*k*fade+4;ctx.save();
    const g=ctx.createRadialGradient(H.x,H.y,0,H.x,H.y,rad*1.8);g.addColorStop(0,'#000');g.addColorStop(.45,'rgba(10,0,30,.95)');g.addColorStop(.6,'rgba(176,124,242,.8)');g.addColorStop(1,'rgba(176,124,242,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(H.x,H.y,rad*1.8,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,241,168,.85)';ctx.lineWidth=3;for(let q=0;q<3;q++){ctx.beginPath();ctx.arc(H.x,H.y,rad*(0.7+q*0.25),now/150+q*2,now/150+q*2+2.2);ctx.stroke()}ctx.restore()}
  for(const b of bodies){if(b.suck){const sc=Math.max(0.05,1-b.st/HOLE_MS);ctx.save();ctx.translate(b.x,b.y);ctx.scale(sc,sc);ctx.translate(-b.x,-b.y);drawBody(b.t,b.x,b.y,b.a);ctx.restore()}else drawBody(b.t,b.x,b.y,b.a)}
  for(const p of fx){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.hole?3:2.4,0,7);ctx.fill()}ctx.globalAlpha=1;
  drawFrame(th);drawDropper(th);if(tip)drawTip();
  ctx.font='900 22px "Black Han Sans","Noto Sans KR",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const p of popups){ctx.globalAlpha=Math.max(0,1-p.t/1.1);const y=p.y-p.t*50;ctx.font='900 22px "Black Han Sans","Noto Sans KR",sans-serif';ctx.fillStyle=fever>0?'#E7D2FF':'#FFD24A';ctx.strokeStyle='#0E2238';ctx.lineWidth=4;ctx.strokeText('+'+fmt(p.v),p.x,y);ctx.fillText('+'+fmt(p.v),p.x,y);
    if(p.lab){ctx.font='900 15px "Noto Sans KR",sans-serif';ctx.fillStyle='#8CF0FF';ctx.strokeText(p.lab,p.x,y-22);ctx.fillText(p.lab,p.x,y-22)}}ctx.globalAlpha=1;
  if(fever>0){ctx.font='900 26px "Black Han Sans","Noto Sans KR",sans-serif';ctx.textAlign='left';ctx.fillStyle='#E7D2FF';ctx.strokeStyle='#0E2238';ctx.lineWidth=5;const tx=`피버 ×2 · ${Math.ceil(fever/1000)}초`;ctx.strokeText(tx,X0+12,TOP+48);ctx.fillText(tx,X0+12,TOP+48)}
  if(combo>=2&&now-lastMerge<COMBO_MS){ctx.font='900 24px "Black Han Sans","Noto Sans KR",sans-serif';ctx.textAlign='right';ctx.fillStyle='#8CF0FF';ctx.strokeStyle='#0E2238';ctx.lineWidth=5;const tx=`${combo} COMBO`;ctx.strokeText(tx,X0+IW-12,TOP+48);ctx.fillText(tx,X0+IW-12,TOP+48)}
}

/* ---------------- 화면 갱신 ---------------- */
let lastE=-1,lastF=null;
function renderEnergy(){const e=Math.floor(energy);if(e!==lastE){$('ebar').style.width=e+'%';$('bHole').disabled=energy<100||over;lastE=e}const f=fever>0;if(f!==lastF){$('feverTag').hidden=!f;lastF=f}}
function renderNext(){const b=BODIES[curTier],n=BODIES[nextTier];$('next').innerHTML=`<img src="${IMG[nextTier]}" alt=""><div><b>${n.n}</b><small>지금 손에: ${esc(b.n)}</small></div>`}
let lastScore=-1,lastBest=-1;
function renderScore(){if(score!==lastScore){$('score').textContent=fmt(score);lastScore=score;renderRank()}if(SAVE.best!==lastBest){$('best').textContent=fmt(SAVE.best);lastBest=SAVE.best}$('newrec').hidden=!newRecord}
function renderLegend(){
  const maxNow=bodies.reduce((m,b)=>Math.max(m,b.t),-1);
  $('legend').innerHTML=`<h2>범례<small>작은 것부터 · 누르면 설명</small></h2>`+BODIES.map((b,i)=>`<button type="button" class="lg ${SAVE.seen[i]?'':'unseen'} ${i===maxNow?'top':''}" data-i="${i}" style="--rc:${b.rim}"><img src="${IMG[i]}" alt=""><span><b><span class="dot"></span>${b.n}</b><small>지구×${b.e}${i<5?' · 떨어뜨림':''}</small></span><span class="p num">${i===0?'—':'+'+fmt(ptsOf(i))}<small><br>${i===10?'두 개면 +66,000':''}</small></span></button>`).join('');
  $('legend').querySelectorAll('.lg').forEach(el=>el.onclick=()=>bodyCard(+el.dataset.i));
}
function renderThemes(){$('themes').innerHTML=Object.entries(THEMES).map(([k,t])=>`<button type="button" class="th ${SAVE.theme===k?'on':''}" data-t="${k}" style="--tc:${t.c}"><i></i>${t.n}</button>`).join('');
  $('themes').querySelectorAll('.th').forEach(b=>b.onclick=()=>{SAVE.theme=b.dataset.t;persist();renderThemes()})}

/* ---------------- 모달 ---------------- */
function openModal(html){$('mbox').innerHTML=html;$('modal').hidden=false;paused=true}
function closeModal(){$('modal').hidden=true;$('mbox').innerHTML='';paused=false}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!over)closeModal()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden&&!over)closeModal()});
function bodyCard(i){const b=BODIES[i];openModal(`<img class="hero" src="${IMG[i]}" alt=""><h3>${b.n}</h3><table><tr><td>실제 지름</td><td class="num">${b.d} km</td></tr><tr><td>지구와 비교</td><td class="num">×${b.e}</td></tr><tr><td>게임 단계</td><td>${i+1} / 11</td></tr><tr><td>만들면 얻는 기본 점수</td><td>${i===0?'떨어뜨리기 전용':'+'+fmt(ptsOf(i))}</td></tr></table><p class="fact" style="margin-top:12px">${esc(b.f)}</p><div class="row"><button class="btn" type="button" id="cClose">계속하기</button></div>`);$('cClose').onclick=closeModal}
function howTo(){openModal(`<h3>하는 법</h3><p>위에서 천체를 떨어뜨려 같은 천체끼리 닿게 하세요. 둘이 합쳐져 한 단계 큰 천체가 됩니다.</p><p>명왕성 → 달 → 수성 → 화성 → 금성 → 지구 → 해왕성 → 천왕성 → 토성 → 목성 → 태양</p><p>손에 쥐는 천체는 작은 다섯 종류뿐. 천체가 위쪽 점선을 1초 넘게 넘어 있으면 끝납니다. 두 태양이 만나면 블랙홀이 되어 사라지고 +66,000점!</p><p><b>점수 올리는 법</b><br>· <b>콤보</b>: 한 번 떨어뜨려 연쇄로 합쳐지면 배율이 ×1.25, ×1.5 … 최대 ×3까지 올라갑니다.<br>· <b>소식</b>: 25초마다 그릇 테마에 맞는 KIRD·과학계·우주 소식이 그릇 위쪽에 5초 동안 떠요.<br>· <b>알파 에너지</b>: 합칠수록 차오르고, 가득 차면 <b>블랙홀</b>(B 키 또는 버튼)을 발동해 명왕성·달·수성을 모두 빨아들여 점수로 바꾸고 8초 동안 <b>피버 ×2</b>.</p><p>최종 점수에 따라 <b>브론즈 예비 → 실버 신진 → 골드 중견 → 플래티넘 책임 → 다이아몬드 수석 → 마스터 리더 과학기술인 → 챌린저 미래비전 2050 리더</b> 등급을 받습니다.</p><div class="row"><button class="btn" type="button" id="cClose">시작하기</button></div>`);$('cClose').onclick=closeModal}
function gameOver(){
  if(over)return;over=true;SAVE.games++;const prevBestRank=SAVE.bestRank;{const ri=rankOf(score).i;if(ri>SAVE.bestRank)SAVE.bestRank=ri}if(score>=SAVE.best){SAVE.best=score;SAVE.bestDate=new Date().toLocaleDateString('ko-KR')}persist();renderScore();
  const t=Math.max(topTier,0),b=BODIES[t],news=NEWS[Math.random()*NEWS.length|0];
  const rk=rankOf(score),R0=RANKS[rk.i],up=rk.i>prevBestRank;
  const share=`알파 유니버스 · ${rk.label} ${R0.title} · ${fmt(score)}점 · ${b.n}까지 키웠어요`;
  openModal(`<h3>${up?'최고 등급 갱신!':newRecord?'신기록!':'게임 끝'}</h3><div class="emb">${emblem(rk.i)}</div><div class="rname" style="color:${R0.dark}">${rk.label}</div><div class="rsub">${R0.title}</div><div class="big num" style="margin-top:6px">${fmt(score)}</div><p style="font-size:13px;margin:2px 0">${rk.next?`다음 등급 ${rk.nextLabel}까지 ${fmt(rk.next-score)}점`:'최고 등급입니다'}</p><div class="stat"><div>최고 점수<b class="num">${fmt(SAVE.best)}</b></div><div>최고 등급<b>${RANKS[SAVE.bestRank].n}</b></div><div>가장 큰 천체<b>${b.n}</b></div></div><div class="stat"><div>최대 콤보<b>${maxCombo}</b></div><div>블랙홀 발동<b>${holesUsed}회</b></div></div><p class="fact"><b>KIRD 한 장 · ${esc(news[0])}</b> ${esc(news[1])}</p><div class="row"><button class="btn" type="button" id="again">다시 하기</button><button class="btn ghost" style="color:var(--ink);border-color:#9FB3CC" type="button" id="copy">결과 문구 복사</button></div><p style="font-size:12px;color:#5B6B82;margin-top:10px">최고 점수는 이 PC 브라우저에만 저장됩니다.</p>`);
  $('again').onclick=()=>{closeModal();restart()};
  $('copy').onclick=()=>{const done=()=>toast('복사했어요: '+share);try{navigator.clipboard.writeText(share).then(done,()=>toast(share,5000))}catch(e){toast(share,5000)}};
}
function restart(){tipT=TIP_FIRST;tip=null;combo=0;maxCombo=0;lastMerge=-1e9;energy=0;fever=0;holes=[];holesUsed=0;lastE=-1;lastF=null;curRank=0;lastRankKey='';bodies=[];fx=[];popups=[];score=0;over=false;paused=false;topTier=0;newRecord=false;lastDrop=-1e9;curTier=randTier();nextTier=randTier();renderNext();renderScore();renderLegend()}

/* ---------------- 입력 ---------------- */
function toWorld(e){const r=cv.getBoundingClientRect();return (e.clientX-r.left)/SC-X0}
cv.addEventListener('pointermove',e=>{aimX=toWorld(e)});
cv.addEventListener('pointerdown',e=>{aimX=toWorld(e);if(e.pointerType==='mouse')drop();else cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse'){aimX=toWorld(e);drop()}});
addEventListener('keydown',e=>{if(!$('modal').hidden)return;if(e.key==='ArrowLeft'){aimX-=16;e.preventDefault()}else if(e.key==='ArrowRight'){aimX+=16;e.preventDefault()}else if(e.key===' '||e.key==='Enter'){drop();e.preventDefault()}else if(e.key==='b'||e.key==='B'){useHole()}});
$('bRestart').onclick=()=>{if(!over&&score>0){SAVE.games++;persist()}closeModal();restart()};
$('bHow').onclick=howTo;
$('bHole').onclick=useHole;
$('rank').onclick=rankTable;
function renderSound(){$('bSound').textContent=SAVE.sound?'소리 끄기':'소리 켜기'}
$('bSound').onclick=()=>{SAVE.sound=!SAVE.sound;persist();renderSound();sfx(3)};
addEventListener('pagehide',persist);

/* ---------------- 배경 별 ---------------- */
function drawStars(){const c=$('stars'),g=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;for(let k=0;k<160;k++){g.fillStyle=`rgba(255,255,255,${Math.random()*.6+.15})`;const s=Math.random()*1.6+.3;g.fillRect(Math.random()*c.width,Math.random()*c.height,s,s)}}
addEventListener('resize',drawStars);

/* ---------------- 루프 ---------------- */
let last=performance.now(),acc=0,lastLegendTop=-2;
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(!paused&&!over){acc+=dt;while(acc>=1/60){now+=1000/60;step(1/60);acc-=1/60;if(over)break}}else acc=0;
  for(const p of fx){p.x+=p.vx/60;p.y+=p.vy/60;if(p.hole){p.vx*=.95;p.vy*=.95}else p.vy+=300/60;p.life-=1/60}fx=fx.filter(p=>p.life>0);
  for(const p of popups)p.t+=1/60;popups=popups.filter(p=>p.t<1.1);renderEnergy();
  render();renderScore();
  const mt=bodies.reduce((m,b)=>Math.max(m,b.t),-1);if(mt!==lastLegendTop){lastLegendTop=mt;renderLegend()}
  requestAnimationFrame(loop);
}
drawStars();fit();renderThemes();renderSound();restart();
if(!SAVE.games&&!SAVE.best)howTo();
requestAnimationFrame(loop);
// 테스트용 훅
window.__U={get bodies(){return bodies},get score(){return score},get over(){return over},drop,setAim:x=>aimX=x,restart,SAVE};
</script>
