<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="../favicon.png"><title>케이요새 월드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;800;900&display=swap">
<style>

/* 한 화면 게임: 캔버스 전체 + 가장자리 HUD + 가운데 모달. 케이요새 남색·파랑·연두 단일 화면(어두운 게임 화면 고정) */
:root{--ink:#0E2238;--night:#0B1020;--panel:rgba(14,20,38,.9);--blue:#2E86D6;--lime:#8CC63F;--gold:#FFD24A;--paper:#F4F7FB;--mute:#9FB3CC;--bad:#E0533F;
--disp:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;--body:"Noto Sans KR",system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:#fff;font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;display:block}
.hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.hb{white-space:nowrap;background:var(--panel);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:6px 12px;font-weight:900;font-size:15px;line-height:1.2}
.hb small{display:block;font-size:10.5px;color:var(--mute);font-weight:800;letter-spacing:.04em}
.brand{font-family:var(--disp);font-size:20px;font-weight:400;letter-spacing:.02em;color:#fff}.brand em{font-style:normal;color:var(--gold)}
.hb.t{font-variant-numeric:tabular-nums}
.sp{flex:1}
.hbtn{pointer-events:auto;background:var(--panel);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:12px;padding:9px 12px;font:800 14px var(--body);cursor:pointer}
.hbtn:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#mmw{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(max(10px,env(safe-area-inset-top,0px)) + 52px);background:var(--panel);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:6px;pointer-events:none}
#mm{width:150px;height:120px;display:block;border-radius:8px}
#joy{position:fixed;left:calc(max(16px,env(safe-area-inset-left,0px)) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.3);touch-action:none;display:none}
#joyk{position:absolute;left:38px;top:38px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.8);border:3px solid var(--ink)}
#actBtn{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.18);border:4px solid var(--ink);color:#fff;font:900 18px var(--body);display:none}
#actBtn.lit{background:var(--gold);color:var(--ink)}
@media (pointer:coarse){#joy,#actBtn{display:block}}
#keyhint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--panel);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--mute);white-space:nowrap}
@media (pointer:coarse){#keyhint{display:none}}
#toast{position:fixed;left:50%;top:calc(max(10px,env(safe-area-inset-top,0px)) + 64px);transform:translateX(-50%);max-width:min(92vw,620px);background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:10px 16px;font-weight:800;font-size:15px;box-shadow:0 10px 24px rgba(0,0,0,.35);text-align:center}
#banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);background:rgba(14,20,38,.92);border:3px solid var(--gold);border-radius:18px;padding:14px 28px;text-align:center;pointer-events:none;max-width:92vw}
#banner b{display:block;font-family:var(--disp);font-weight:400;font-size:clamp(22px,5vw,38px);color:#FFE07A;line-height:1.2}
#banner small{display:block;margin-top:6px;font-size:14px;font-weight:700;color:#DCE6F2}
#banner.on{animation:pop .3s ease}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.8);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){#banner.on{animation:none}}
#modal{position:fixed;inset:0;background:rgba(6,10,22,.6);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow:auto}
.box{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;width:min(640px,100%);padding:18px 20px 20px;box-shadow:0 20px 50px rgba(0,0,0,.5);max-height:100%;overflow:auto;touch-action:auto}
.box.wide{width:min(980px,100%)}
.mh{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.mh h3{margin:2px 0 0;font-size:22px;font-weight:900;line-height:1.25}
.mk{font-size:12px;font-weight:800;color:#2E6CB0;letter-spacing:.02em}
.chip{flex:none;background:var(--c);color:#fff;font-weight:900;font-size:13px;border-radius:8px;padding:6px 8px;border:2px solid var(--ink)}
.x{margin-left:auto;align-self:flex-start;background:none;border:2px solid var(--ink);border-radius:10px;width:36px;height:36px;font-weight:900;cursor:pointer;color:var(--ink)}
.q{font-size:16px;font-weight:700;line-height:1.6;margin:6px 0 12px}
.mono{font-family:ui-monospace,monospace;font-size:20px;letter-spacing:.2em;background:#13294B;color:#FFE07A;padding:2px 8px;border-radius:6px}
.opts{display:grid;gap:8px}.opts.two{grid-template-columns:1fr 1fr}
.opt{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:12px 14px;font:800 15px var(--body);text-align:left;cursor:pointer;color:var(--ink)}
.opt:hover{background:#EEF6FF}.opt.right{background:#EAF6DA;border-color:#2FA84F}.opt.wrong{background:#FFECE8;border-color:var(--bad)}.opt:disabled{opacity:.35}
.feed{min-height:22px;margin-top:10px;font-weight:800;font-size:14px}.feed.bad{color:#B3261E}
.btn{background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:11px 18px;font:900 16px var(--body);cursor:pointer;margin-top:12px}
.btn.sm{padding:6px 12px;font-size:13px;margin:0}.btn.ghost{background:#fff}.btn:disabled{opacity:.5}
.dial{display:flex;gap:10px;justify-content:center;margin:8px 0}
.dg{width:58px;height:72px;border-radius:12px;border:3px solid var(--ink);background:#13294B;color:#FFE07A;font:900 38px var(--body);text-align:center}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.slot{border:2px dashed #9AA8BA;border-radius:12px;min-height:54px;display:grid;place-items:center;font-weight:900;color:#9AA8BA;text-align:center;padding:4px;font-size:14px}
.slot.fill{border-style:solid;border-color:#2FA84F;background:#EAF6DA;color:var(--ink)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bin{border-radius:12px;padding:8px 12px;font-weight:900;text-align:center}.bin.l{background:#EEF6FF;color:#1B5EA0}.bin.r{background:#FFF1D6;color:#8A5A00}
.pool{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tok{border:2px solid var(--ink);border-radius:12px;background:#fff;padding:10px;font:900 16px var(--body);cursor:pointer;color:var(--ink)}
.tok small{display:block;font-size:11px;font-weight:800;color:#7A889C;margin-top:2px}.tok.l{background:#EEF6FF;border-color:#1B5EA0}.tok.r{background:#FFF1D6;border-color:#B5701A}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{aspect-ratio:1.3;max-width:100%;border-radius:12px;border:2px solid var(--ink);background:#13294B;cursor:pointer;font:900 15px var(--body);color:transparent;position:relative}
.card::after{content:'?';position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);font-size:26px}
.card.up{background:#fff;color:var(--ink)}.card.up::after{content:none}.card.ok{background:#EAF6DA;border-color:#2FA84F}
.mini{position:relative}.mini canvas{width:100%;display:block;border-radius:14px;border:2px solid var(--ink);touch-action:none}
.mhud{position:absolute;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;font-weight:900;font-size:16px;color:#fff;pointer-events:none;font-variant-numeric:tabular-nums}
.mhud span{background:rgba(14,20,38,.8);border-radius:8px;padding:3px 10px}
.ctrl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px}
.ctrl label{flex:1;min-width:180px;font-weight:800;font-size:14px;display:flex;flex-direction:column;gap:4px}.ctrl input{width:100%;accent-color:var(--blue)}.ctrl .btn{margin:0}
.win{text-align:center}.win .key{font-size:54px}.win h3{font-family:var(--disp);font-weight:400;font-size:32px;margin:4px 0}.win .sub{font-weight:800;color:#3A4A62}.win p{font-size:15px;line-height:1.65;font-weight:600;color:#334;max-width:46ch;margin:10px auto}
.pill{display:inline-block;border-radius:99px;padding:5px 12px;font-weight:800;font-size:13px;background:#E6ECF4;color:var(--ink);margin:3px}.pill.ok{background:#EAF6DA;color:#2F6B14}
.got .pill{border-left:6px solid var(--c)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.help p{font-size:15px;line-height:1.7;font-weight:600}.help ul{font-size:15px;line-height:1.9;font-weight:600;padding-left:20px;margin:6px 0}.help .note{font-size:12.5px;color:#5B6B82;line-height:1.6}
.wmap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:start}.wmap canvas{width:100%;border-radius:12px;border:2px solid var(--ink)}
.legend{display:grid;gap:8px}.mrow .rn{font-size:12px;font-weight:900;color:#2E6CB0;margin-bottom:4px}.cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cell{border-radius:10px;background:#fff;border:2px solid var(--c);padding:6px;min-width:0;position:relative}.cell b{display:block;font-size:13px;color:var(--c)}.cell span{display:block;font-size:10.5px;font-weight:800;line-height:1.3;word-break:keep-all}.cell small{display:block;font-size:10px;color:#7A889C;font-weight:800;margin-top:2px}.cell em{display:block;font-style:normal;font-size:9.5px;font-weight:900;color:#8A5A00}
.cell.done{background:#EAF6DA}
@media (max-width:760px){.wmap{grid-template-columns:1fr}.cells{grid-template-columns:repeat(3,minmax(0,1fr))}.opts.two{grid-template-columns:1fr}.mem{grid-template-columns:repeat(2,1fr)}.pool{grid-template-columns:repeat(2,1fr)}#mmw{display:none}.hb small{display:none}#locbox{display:none}.brand{font-size:16px}.hb{font-size:13px;padding:6px 9px}.hbtn{padding:7px 9px;font-size:12px}.hud{gap:6px}}

/* ---- 월드 전용 */
.hud{z-index:3}
.homelink{display:block;margin-top:12px;text-align:center;font-weight:800;color:#1F6FB2}.menuhome{color:#FFE07A;margin:10px 0}
.stp{display:flex;gap:6px;align-items:center}.stp input{flex:1}
#danger{position:fixed;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top,0px)) + 58px);z-index:12;background:#E0533F;color:#fff;font-weight:900;border-radius:12px;padding:8px 16px;border:2px solid #0E2238;pointer-events:none;white-space:nowrap}#danger.far{background:#2B3F6B}#danger.mid{background:#B5701A}
#roomcard{position:fixed;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top,0px)) + 112px);display:flex;gap:10px;align-items:center;background:rgba(14,20,38,.9);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 14px;pointer-events:none;z-index:2;max-width:calc(100vw - 32px)}
#roomcard i{width:10px;align-self:stretch;border-radius:6px}#roomcard b{display:block;font-size:16px;font-weight:900}#roomcard small{display:block;font-size:12px;color:#C9D6E8;font-weight:700}
#roomcard.on{animation:rc .35s ease}@keyframes rc{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (max-width:760px){#roomcard{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 200px)}}
#modal{z-index:10;grid-template-columns:minmax(0,1fr)}.box{min-width:0;justify-self:center;box-sizing:border-box}.smn,.rgc,.kpb{min-width:0}.simon{gap:6px}#toast,#banner{z-index:11}
.mini canvas{max-height:56vh;object-fit:contain}
#tasks{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(max(10px,env(safe-area-inset-top,0px)) + 58px);width:236px;background:var(--panel);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 10px 10px;font-size:12.5px;font-weight:700;pointer-events:auto;max-height:calc(100vh - 220px);overflow:auto;z-index:2}
#tasks.min .tk{display:none}#tasks.min .tk-bar{margin-bottom:0}
.tk-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;cursor:pointer}.tk-h b{font-family:var(--disp);font-weight:400;font-size:16px;color:var(--gold)}
.tk-bar{height:6px;border-radius:9px;background:#26324A;margin:6px 0 6px;overflow:hidden}.tk-bar i{display:block;height:100%;background:var(--lime);transition:width .4s}
.tk{padding:4px 0;border-top:1px solid rgba(255,255,255,.08);line-height:1.35;color:#fff}.tk em{font-style:normal;font-size:10px;font-weight:900;color:var(--mute);margin-right:6px}
.tk.ok{color:#8BE07A;text-decoration:line-through;text-decoration-color:rgba(139,224,122,.6)}.tk.lock{color:var(--mute)}
#inv{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 46px);display:flex;gap:6px;pointer-events:auto;z-index:2;max-width:calc(100vw - 32px);flex-wrap:wrap;justify-content:center}
.iv{background:var(--panel);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:4px 8px;font-size:20px;display:flex;align-items:center;gap:4px}.iv small{font-size:11px;font-weight:800;color:#DCE6F2}
.iv.fr b{font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums}.iv.fr.no{opacity:.45}
#altBtn{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 116px);bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.18);border:4px solid var(--ink);color:#fff;font:900 14px var(--body);display:none}
@media (pointer:coarse){#altBtn.on{display:block}#inv{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}}
.rg{display:grid;grid-template-columns:34px 1fr 34px;gap:6px;align-items:center;background:var(--bg);padding:10px;border-radius:14px;border:2px solid var(--ink)}
.rg-grid{grid-column:2;grid-row:1/-1;display:grid;gap:4px;width:100%;align-self:stretch}.rg-end{font-size:22px;text-align:center}.rg-end.l{grid-column:1}.rg-end.r{grid-column:3}
.rgc{aspect-ratio:1;border:0;border-radius:8px;background:rgba(255,255,255,.06);padding:0;cursor:pointer;transform:rotate(var(--r,0deg));transition:transform .12s}
.rgc svg{width:100%;height:100%;display:block}.rgc:focus-visible{outline:3px solid var(--gold)}
.simon{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:10px 0}
.smn{aspect-ratio:1;border-radius:50%;border:4px solid var(--ink);background:color-mix(in srgb,var(--c) 35%,#1E2638);cursor:pointer;font:900 13px var(--body);color:#fff;transition:transform .08s}
.smn.on{background:var(--c);transform:scale(1.08);box-shadow:0 0 24px var(--c);color:var(--ink)}
.kp-disp{font:900 34px ui-monospace,monospace;letter-spacing:.3em;text-align:center;background:#13294B;color:#FFE07A;border-radius:12px;padding:10px;margin:6px 0 10px}
.kp-disp.term{background:#04140A;color:#7CFF8A;border:2px solid #2FA84F}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:340px;margin:0 auto}
.kpb{border:2px solid var(--ink);border-radius:12px;background:#fff;font:900 22px var(--body);padding:12px 0;cursor:pointer;color:var(--ink)}.kpb.go{background:var(--gold);font-size:16px}
.ord{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}.ord div{background:#13294B;color:#fff;border-radius:12px;padding:10px;text-align:center}.ord small{display:block;color:var(--gold);font-weight:900}.ord b{display:block;font-size:34px}.ord span{font-size:12px;font-weight:800}
.note{font-size:12.5px;color:#5B6B82;line-height:1.6}
/* 메뉴 */
#menu{position:fixed;inset:0;z-index:5;overflow:auto;background:radial-gradient(ellipse at 50% 0%,#1D3A6E 0%,#0B1020 62%);padding:max(20px,env(safe-area-inset-top,0px)) 16px 40px}
.mwrap{max-width:1080px;margin:0 auto}
.mt{text-align:center;margin:18px 0 6px}.mt h1{font-family:var(--disp);font-weight:400;font-size:clamp(40px,9vw,84px);margin:0;line-height:1;letter-spacing:.02em}.mt h1 em{font-style:normal;color:var(--gold)}
.mt p{color:#C9D6E8;font-weight:700;margin:10px auto 0;max-width:60ch;line-height:1.6}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:26px}
.mc{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:2px solid rgba(255,255,255,.14);border-radius:20px;padding:16px;color:#fff;text-align:left;cursor:pointer;font-family:var(--body);display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.mc:hover,.mc:focus-visible{transform:translateY(-3px);border-color:var(--gold);outline:none}
.mc canvas{width:100%;aspect-ratio:16/10;border-radius:12px;background:#0A0F1C;display:block}
.mc h2{margin:2px 0 0;font-family:var(--disp);font-weight:400;font-size:28px}.mc .tg{font-size:12px;font-weight:900;color:var(--gold)}
.mc p{margin:0;font-size:14px;line-height:1.55;color:#C9D6E8;font-weight:600}.mc ul{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:#DCE6F2;font-weight:700}
.mc .go{margin-top:auto;background:var(--gold);color:var(--ink);border-radius:12px;padding:10px;text-align:center;font-weight:900}
.mfoot{margin-top:22px;text-align:center;color:var(--mute);font-size:13px;font-weight:700;line-height:1.7}
.mfoot button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:6px 12px;font:800 13px var(--body);cursor:pointer;margin:4px}
@media (max-width:860px){.modes{grid-template-columns:1fr}}
@media (max-width:760px){.iv{padding:3px 6px;font-size:16px}.iv small{display:none}.iv.fr b{font-size:13px}#inv{gap:4px;flex-wrap:nowrap}.hbtn{white-space:nowrap}#modebox{display:none}#hintBtn,#mapBtn,#menuBtn{padding:7px 8px}#tasks{width:190px;font-size:11.5px;top:calc(max(10px,env(safe-area-inset-top,0px)) + 50px)}}
.big{font-family:var(--disp);font-weight:400;font-size:44px;color:var(--gold)}
#centerMsg{position:fixed;left:50%;top:32%;transform:translateX(-50%);font-family:var(--disp);font-size:clamp(28px,6vw,54px);color:#FFE07A;text-shadow:0 4px 0 #0E2238;pointer-events:none;z-index:2;text-align:center;white-space:nowrap}
#centerMsg small{display:block;font-family:var(--body);font-size:15px;font-weight:800;color:#fff;text-shadow:none;margin-top:4px}
.bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top,0px)) + 58px);width:min(360px,60vw);height:10px;background:#26324A;border-radius:9px;overflow:hidden;z-index:2;pointer-events:none}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8CC63F,#FFD24A)}
</style>
