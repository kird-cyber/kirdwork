<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="KIRD 알파 마블 — 세계 과학기술 도시 24곳에 연구 거점을 세우는 부루마불형 보드게임">
<link rel="icon" href="../favicon.png?v=2">
<meta name="theme-color" content="#0A1222">
<title>KIRD 알파 마블</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;800;900&display=swap">
<style>
/* 레이아웃: 가로로 긴 15×9 보드(44칸). 보드 가운데 왼쪽은 판 상황, 오른쪽은 주사위·예보·선택. 말은 보드 위 별도 층에서 한 칸씩 미끄러져 이동. 휴대폰은 보드를 가로 스크롤하고 조작판을 아래에 고정 */
:root{
  --night:#0A1222;--ink:#0E2238;--panel:#13213D;--panel2:#0F1B33;--line:rgba(255,255,255,.14);
  --blue:#2E86D6;--lime:#8CC63F;--gold:#FFD24A;--paper:#F4F7FB;--mute:#9FB3CC;--red:#E0533F;--orange:#F08A24;
  --l1:#F28C6B;--l2:#F2B84B;--l3:#B9D45A;--l4:#35BFA4;--l5:#4FA3EA;--l6:#9AA6D6;--l7:#B07CF2;--l8:#E86FA3;--fac:#6CC070;
  --disp:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;--body:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:#fff;font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font-family:var(--body)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto;box-sizing:border-box}
.num{font-variant-numeric:tabular-nums}
.btn{background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:9px 14px;font-weight:900;font-size:14px;cursor:pointer;line-height:1.2}
.btn small{display:block;font-size:11px;font-weight:800;opacity:.8}
.btn.ghost{background:transparent;color:#fff;border-color:var(--line)}
.btn.blue{background:var(--blue);color:#fff}
.btn.lime{background:var(--lime)}
.btn.dark{background:#3A465C;color:#fff}
.btn.big{font-size:18px;padding:12px 22px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.top{display:flex;gap:8px;align-items:center;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-size:22px}.brand em{font-style:normal;color:var(--gold)}
.sp{flex:1}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px}
.pill b{color:var(--gold)}
.seg2{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg2 button{background:none;border:0;color:var(--mute);font-weight:800;font-size:12.5px;padding:7px 10px;cursor:pointer}
.seg2 button.on{background:var(--gold);color:var(--ink)}

.boardscroll{padding-block:2px 10px}
.frame{position:relative;width:min(100%,calc((100vh - 84px) * 15.6 / 9.6),1288px);margin:0 auto}
.board{display:grid;grid-template-columns:1.3fr repeat(13,1fr) 1.3fr;grid-template-rows:1.3fr repeat(7,1fr) 1.3fr;gap:3px;aspect-ratio:15.6/9.6;background:#0D1B33;border:3px solid #0D1B33;border-radius:14px;box-shadow:0 0 0 2px var(--lime),0 24px 50px rgba(0,0,0,.5)}
.cell{position:relative;border:0;border-radius:6px;background:#1A2A4A;color:#fff;padding:0 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;min-width:0;text-align:center;transition:background .2s}
.cell .band{position:absolute;left:0;right:0;top:0;height:15%;background:var(--lc,transparent)}
.cell.right .band{left:auto;width:15%;height:auto;bottom:0}
.cell.left .band{right:auto;width:15%;height:auto;bottom:0}
.cell.top .band{top:auto;bottom:0}
.cell .ic{width:64%;height:42%;flex:none;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.cell.corner .ic{width:56%;height:46%}
.dic{width:100%;height:100%;display:block}
.deed .hd{display:flex;gap:14px;align-items:center}
.deed .hd .dic{width:84px;height:84px;flex:none;background:#13213D;border-radius:14px;padding:6px;box-sizing:border-box}
.dxi{display:inline-block;width:34px;height:34px;background:#13213D;border-radius:8px;padding:3px;box-sizing:border-box;vertical-align:middle;margin-right:8px;float:left}
.cell .nm{font-weight:900;font-size:clamp(9px,.9vw,12.5px);line-height:1.12;word-break:keep-all}
.cell .sub{font-size:clamp(8px,.78vw,11px);font-weight:800;color:var(--mute);line-height:1.1}
.cell.corner{background:#1D3A66}
.cell.corner .nm{font-family:var(--disp);font-weight:400;font-size:clamp(12px,1.35vw,19px);color:var(--gold)}
.cell.key{background:#22324F}.cell.key .nm{color:var(--gold)}
.cell.fac{background:#1C3A34}
.cell.sp{background:#2A2346}.cell.sp .nm{color:#E6D7FF}
.cell.kird{background:#1E4A3A}.cell.kird .nm{color:#C8F08E}
.cell.own{box-shadow:inset 0 0 0 3px var(--oc)}
.cell.trail{background:#2C4A7A}
.cell .lv{position:absolute;right:3px;bottom:3px;display:flex;gap:2px}
.cell.top .lv{bottom:auto;top:3px}
.cell .lv i{display:block;width:5px;height:9px;border-radius:2px;background:var(--oc)}
.cell .lv i.lm{width:10px;background:var(--gold);border:1px solid var(--oc)}
.cell .tag{position:absolute;left:3px;top:3px;font-size:9px;font-weight:900;border-radius:4px;padding:0 3px;background:var(--gold);color:var(--ink);line-height:1.4}
.cell.top .tag{top:auto;bottom:3px}
.cell .mk{position:absolute;right:2px;top:2px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;font:900 12px var(--body);color:#fff;background:var(--mc);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:1;padding:0 3px}
.cell.top .mk{top:auto;bottom:2px}
.cell.marked{box-shadow:inset 0 0 0 3px var(--mc)}
.cell.choose{animation:pulse 1s infinite}
.cell.choose:hover{background:#2C4A7A}
.cell.nochoose{opacity:.45}
@keyframes pulse{50%{box-shadow:inset 0 0 0 3px var(--gold)}}
@media (prefers-reduced-motion:reduce){.cell.choose{animation:none;box-shadow:inset 0 0 0 3px var(--gold)}}

.tokens{position:absolute;inset:0;pointer-events:none}
.tk{position:absolute;left:0;top:0;width:var(--ts,30px);height:var(--ts,30px);margin:calc(var(--ts,30px) / -2) 0 0 calc(var(--ts,30px) / -2);transition:transform var(--tt,.3s) cubic-bezier(.3,.7,.4,1);z-index:2}
.tk .body{width:100%;height:100%;border-radius:50%;background:var(--pc);border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.6);overflow:hidden;box-sizing:border-box}
.tk .body svg{width:100%;height:100%;display:block}
.tk.hop .body{animation:hop var(--tt,.3s) ease-out}
.tk.active{z-index:3}
.tk.active .body{box-shadow:0 0 0 4px var(--gold),0 4px 12px rgba(0,0,0,.6)}
.tk .left{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-4px);background:var(--gold);color:var(--ink);font:900 13px var(--body);border-radius:8px;padding:1px 7px;border:2px solid var(--ink);white-space:nowrap}
.tk .left:empty{display:none}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-55%) scale(1.08)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.tk{transition:none}.tk.hop .body{animation:none}}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;background:rgba(10,18,34,.94);border:3px solid var(--bc,var(--gold));border-radius:18px;padding:12px 26px;text-align:center;animation:pop .3s ease}
.banner b{display:block;font-family:var(--disp);font-weight:400;font-size:clamp(24px,3.4vw,44px);color:var(--bc,var(--gold));line-height:1.1}
.banner small{display:block;font-weight:800;color:#fff;font-size:15px;margin-top:4px}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.7);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.banner{animation:none}}

.center{grid-row:2/9;grid-column:2/15;background:radial-gradient(ellipse at 40% 30%,#1C4C80,#0F2442 72%);border-radius:10px;display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:14px;padding:clamp(8px,1.2vw,16px);min-width:0;min-height:0;overflow:hidden}
.cl{display:flex;flex-direction:column;gap:clamp(6px,.8vw,10px);min-width:0;min-height:0}
.ctitle{font-family:var(--disp);font-size:clamp(22px,2.8vw,40px);line-height:1}
.ctitle em{font-style:normal;color:var(--gold)}
.gauge .lab{display:flex;justify-content:space-between;font-size:clamp(10px,.9vw,12.5px);font-weight:800;color:#DCE6F2;margin-bottom:3px;gap:6px}
.gauge .bar{height:9px;border-radius:9px;background:#0A1530;overflow:hidden;border:1px solid var(--line)}
.gauge .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--gold));transition:width .4s}
.score{display:grid;gap:4px}
.sc{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:3px 8px 3px 3px}
.sc.turn{border-color:var(--gold);background:rgba(255,210,74,.12)}
.sc.out{opacity:.4}
.sc .av{width:clamp(22px,2.2vw,30px);height:clamp(22px,2.2vw,30px);border-radius:50%;background:var(--pc);border:2px solid #fff;overflow:hidden;flex:none;box-sizing:border-box}
.sc .av svg{width:100%;height:100%;display:block}
.sc b{font-size:clamp(11px,1vw,13.5px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .st{font-size:10.5px;font-weight:800;color:#FFB3A7;white-space:nowrap}
.sc .m{margin-left:auto;font-weight:900;color:var(--gold);font-size:clamp(11px,1vw,14px);white-space:nowrap}
.fact{font-size:clamp(9.5px,.85vw,12px);font-weight:700;color:var(--mute);line-height:1.45;margin-top:auto}
.fact b{color:var(--gold)}
.cr{display:flex;flex-direction:column;gap:clamp(6px,.8vw,10px);min-width:0;min-height:0}

.ctrl{display:flex;flex-direction:column;gap:8px;min-width:0}
.dicerow{display:flex;align-items:center;gap:12px}
.die{width:clamp(38px,3.9vw,58px);height:clamp(38px,3.9vw,58px);flex:none}
.die.spin{animation:sp .12s linear infinite}
@keyframes sp{50%{transform:rotate(14deg) scale(.94)}}
@media (prefers-reduced-motion:reduce){.die.spin{animation:none}}
.tot{font-family:var(--disp);font-size:clamp(28px,3.3vw,48px);color:var(--gold);line-height:1;min-width:1.4em}
.tot small{display:block;font-family:var(--body);font-size:12px;font-weight:800;color:#DCE6F2}
.cmsg{font-weight:800;font-size:clamp(11.5px,1.05vw,14.5px);line-height:1.4;min-height:1.4em;color:#fff}
.crow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px;align-items:start}
.notice{background:rgba(6,12,26,.72);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.notice:empty{display:none}
.notice h5{margin:0 0 5px;font-size:12px;font-weight:900;color:var(--gold);letter-spacing:.02em}
.nr{display:flex;align-items:center;gap:7px;padding:3px 0;border-top:1px solid rgba(255,255,255,.06);font-size:clamp(11px,.95vw,13px);font-weight:800}
.nr:first-of-type{border-top:0}
.nr .s{min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;background:var(--mc);color:#fff;font-weight:900;font-size:13px;border:2px solid #fff;flex:none}
.nr .w{min-width:0;flex:1;line-height:1.3}
.nr .w small{display:block;font-size:11px;font-weight:700;color:var(--mute)}
.nr .p{font-size:11.5px;color:var(--mute);white-space:nowrap}
.nr.hit{background:rgba(255,210,74,.15);border-radius:8px}
.risk{margin-top:5px;font-size:11.5px;font-weight:800;color:#FFB3A7}
.risk.ok{color:#CBEFA0}
.prompt{background:rgba(6,12,26,.82);border:2px solid var(--gold);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.prompt:empty{display:none}
.prompt h4{margin:0;font-size:clamp(13px,1.15vw,16px);font-weight:900;line-height:1.3}
.prompt p{margin:0;font-size:clamp(11px,.95vw,13px);font-weight:700;color:#DCE6F2;line-height:1.45}
.prompt .row{display:flex;gap:6px;flex-wrap:wrap}
.prompt .row .btn{flex:1 1 auto}

#dock{display:none}
.lower{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;padding-block:6px 30px}
.pcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
.pcard{display:flex;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 10px;position:relative;min-width:0}
.pcard.turn{border-color:var(--gold)}
.pcard.out{opacity:.4}
.pcard .av{width:42px;height:42px;flex:none;border-radius:50%;background:var(--pc);border:2px solid #fff;overflow:hidden;box-sizing:border-box}
.pcard .av svg{width:100%;height:100%;display:block}
.pcard b{font-size:14px}
.pcard .meta{font-size:11.5px;font-weight:700;color:var(--mute);line-height:1.45}
.pcard .cash{font-family:var(--disp);font-size:17px;color:var(--gold);margin-left:auto;text-align:right;line-height:1.1;white-space:nowrap}
.pcard .cash small{display:block;font-family:var(--body);font-size:10.5px;font-weight:800;color:var(--mute)}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.bd{font-size:10.5px;font-weight:900;border-radius:6px;padding:1px 6px;background:rgba(255,255,255,.1)}
.bd.w{background:rgba(224,83,63,.3);color:#FFB3A7}.bd.g{background:rgba(140,198,63,.25);color:#CBEFA0}
.logbox{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;max-height:240px;overflow:auto;min-width:0}
.logbox h3{margin:0 0 6px;font-size:13px;color:var(--mute);letter-spacing:.06em}
.logbox ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.logbox li{font-size:12.5px;font-weight:600;line-height:1.45;color:#DCE6F2;border-top:1px solid rgba(255,255,255,.06);padding-top:4px}
.logbox li:first-child{border-top:0;color:#fff}

#modal{position:fixed;inset:0;z-index:30;background:rgba(5,10,22,.74);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow:auto}
.box{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;width:min(640px,100%);padding:18px 20px 20px;box-shadow:0 20px 50px rgba(0,0,0,.5);max-height:100%;overflow:auto;box-sizing:border-box}
.box.wide{width:min(960px,100%)}
.mh{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.mh h3{margin:0;font-family:var(--disp);font-weight:400;font-size:26px;line-height:1.15}
.x{margin-left:auto;background:none;border:2px solid var(--ink);border-radius:10px;width:36px;height:36px;font-weight:900;cursor:pointer;color:var(--ink);flex:none}
.box p{line-height:1.65;font-weight:600;margin:6px 0}
.picks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pk{border:2px solid #D3DCE8;border-radius:14px;background:#fff;padding:6px 4px;cursor:pointer;text-align:center;color:var(--ink);min-width:0}
.pk svg{width:100%;max-width:60px;height:auto}
.pk b{display:block;font-size:13px}.pk small{display:block;font-size:10.5px;font-weight:700;color:#3E5878;line-height:1.3;word-break:keep-all;min-height:2.6em}
.pk.on{border-color:var(--ink);background:#FFF5CC}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--ink);background:#fff;border-radius:99px;padding:7px 14px;font-weight:900;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.card{border-radius:18px;padding:18px;color:var(--ink);border:3px solid var(--ink);background:#fff}
.card .kind{font-size:12px;font-weight:900;letter-spacing:.08em;color:#fff;background:var(--kc);display:inline-block;border-radius:8px;padding:3px 9px}
.card h4{font-family:var(--disp);font-weight:400;font-size:26px;margin:10px 0 6px;line-height:1.2}
.card .q{font-size:17px;font-weight:800;line-height:1.55;margin:8px 0 12px}
.opts{display:grid;gap:8px}
.opt{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:12px 14px;font:800 15px var(--body);text-align:left;cursor:pointer;color:var(--ink)}
.opt.right{background:#EAF6DA;border-color:#2FA84F}.opt.wrong{background:#FFECE8;border-color:var(--red)}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox .opt{text-align:center;font-family:var(--disp);font-weight:400;font-size:40px;padding:8px}
.res{margin-top:12px;font-weight:800;line-height:1.55}
.res.ok{color:#2F7A1E}.res.no{color:#B3261E}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .card{cursor:pointer;padding:14px}.two .card h4{font-size:20px}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb td,table.tb th{border-bottom:1px solid #D3DCE8;padding:7px 6px;text-align:left;vertical-align:top}
table.tb th{font-size:12px;color:#3E5878}
table.tb .r{text-align:right}
.tw{overflow-x:auto}
.chipl{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--lc);margin-right:6px;vertical-align:0}
.deed{border:3px solid var(--ink);border-radius:16px;overflow:hidden}
.deed .hd{background:var(--lc);padding:12px 16px;color:var(--ink)}
.deed .hd small{font-weight:900;font-size:12px}
.deed .hd b{display:block;font-family:var(--disp);font-weight:400;font-size:30px;line-height:1.1}
.deed .bd2{padding:12px 16px}
.rules ul{padding-left:20px;line-height:1.75;font-weight:600;font-size:14.5px;margin:4px 0}
.rules h4{margin:14px 0 4px}
.rank{display:grid;gap:8px;margin:10px 0}
.rk{display:flex;gap:10px;align-items:center;border:2px solid #D3DCE8;border-radius:14px;padding:8px 12px;background:#fff}
.rk.w{border-color:var(--ink);background:#FFF5CC}
.rk svg{width:44px;height:44px;flex:none}
.rk .n{font-family:var(--disp);font-size:22px;width:28px}
.rk .a{margin-left:auto;text-align:right;font-weight:900}
.rk .a small{display:block;font-size:11.5px;color:#3E5878;font-weight:700}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:40;max-width:min(92vw,560px);background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:10px 16px;font-weight:800;font-size:15px;box-shadow:0 10px 24px rgba(0,0,0,.35);text-align:center}

@media (max-width:760px){
  .boardscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
  .frame{width:1000px;margin:0}
  .center{grid-template-columns:1fr}
  .cr{display:none}
  .fact{display:none}
  #dock{display:block;position:sticky;bottom:0;z-index:6;background:rgba(10,18,34,.97);border-top:2px solid var(--gold);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));margin-top:6px}
  .crow{grid-template-columns:1fr}
  .lower{grid-template-columns:1fr}
  .pcards{grid-template-columns:1fr}
  .picks{grid-template-columns:repeat(3,minmax(0,1fr))}
  .two{grid-template-columns:1fr}
  .top .hide-m{display:none}

function tollOf(c,payer){

  if(c.t==='fac'){const n=G.cells.filter(x=>x.t==='fac'&&x.owner===c.owner).length;return FAC_TOLL[n]}
  let t=c.p*RATE[c.level];
  if(lineDone(c.line,c.owner))t*=2;
  if(G.cells.indexOf(c)===G.festa)t*=2;
  if(payer&&payer.ch.id==='globi'&&!c.kr)t*=.9;

}
const canLandmark=(p,c)=>c.level===3&&p.laps>c.buyLap;

const WAYS=[0,0,1,2,3,4,5,6,5,4,3,2,1];
function forecast(p){
  const out=[];
  for(let s=2;s<=12;s++){
    const i=(p.pos+s)%N,c=G.cells[i];let kind='',amt=0,label='',score=0;
    if(c.t==='city'||c.t==='fac'){
      if(c.owner>=0&&c.owner!==p.id){amt=-tollOf(c,p);kind='toll';label=`통행료 ${fmtA(-amt)}`;score=-amt}
      else if(c.owner===p.id){kind='own';label=canBuild(p,c)?'내 땅 · 건설 가능':'내 땅';score=c.t==='city'&&canBuild(p,c)?15000:5000}
      else{kind='free';label=`빈 땅 ${fmtA(c.t==='fac'?FAC_PRICE:priceOf(p,c))}`;score=c.t==='fac'?40000:20000}
    }else{
      const M={key:['key','알파 키 카드',30000],safety:['bad','안전점검 2턴',160000],donate:['bad',`기부 ${fmtA(DONATE)}`,DONATE],reward:['good',`+${fmtA(REWARD)}`,REWARD],
        boost:['good',`${BOOST}칸 더 → ${G.cells[(i+BOOST)%N].n}`,90000],back:['bad',`${BACK}칸 뒤로 → ${G.cells[(i-BACK+N)%N].n}`,60000],
        fund:['good',`인재기금 ${fmtA(G.fund)}`,Math.max(30000,G.fund)],nuri:['good','원하는 칸으로',100000],kird:['good','무료 건설',120000],
        festa:['good',owned(p).some(x=>x.t==='city')?'통행료 2배 지정':'페스타',owned(p).some(x=>x.t==='city')?80000:10000],start:['good','출발점',SALARY]};
      [kind,label,score]=M[c.t]||['',c.n,0];
    }
    out.push({s,i,cell:c,kind,amt,label,score,prob:WAYS[s]/36});
  }
  const risk=out.filter(o=>o.kind==='toll').reduce((a,o)=>a+o.prob,0);
  const top=out.slice().sort((a,b)=>b.score-a.score||b.prob-a.prob).slice(0,3);
  return{all:out,top,risk};
}

async function decide(p,kind,ctx){
  if(p.human&&HOOK.ask)return HOOK.ask(p,kind,ctx);
  const res=AI_RESERVE[p.ch.id]*START_CASH*(G.round>12?.5:1);
  const groupGain=c=>c.t==='city'?lineCells(c.line).filter(x=>x.owner===p.id).length:0;
  switch(kind){
    case'buy':return p.cash-ctx.cost>=res*(groupGain(ctx.cell)?.5:1);
    case'build':{let best=0;for(const o of ctx.opts){if(p.cash-o.cost>=res*.8)best=o.lv}return best}
    case'takeover':{const c=ctx.cell;const completes=lineCells(c.line).every(x=>x.owner===p.id||x===c);const g=groupGain(c);return p.cash-ctx.cost>=res*(completes?.05:g?.4:.8)&&(completes||Math.random()<(g?.75:.25))}
    case'quiz':{const right=Math.random()<.7;if(ctx.k==='ox')return right?ctx.a:!ctx.a;return right?ctx.a:(ctx.a+1)%ctx.o.length}
    case'jail':return'quiz';
    case'choose':return aiChooseCell(p);
    case'pickOwn':return ctx.cells.slice().sort((a,b)=>(kind==='pickOwn'&&ctx.mode==='festa'?tollOf(G.cells[b])-tollOf(G.cells[a]):G.cells[b].p-G.cells[a].p))[0];
    case'card2':return cardValue(p,ctx[0])>=cardValue(p,ctx[1])?0:1;
    case'roll':return true;
  }
}
function cardValue(p,c){if(c.k==='ox'||c.k==='safe')return 6;const m={money:c.v/20000,allbank:2.5,move:3,freebuild:7,shield:5,choose:8,jail:-6,tax:-3,collect:3,payall:-2};return m[c.fx]??0}
function aiChooseCell(p){
  let best=0,bv=-1;
  G.cells.forEach((c,i)=>{if(i===NURI)return;let v=0;
    if((c.t==='city'||c.t==='fac')&&c.owner===-1&&p.cash>(c.p||FAC_PRICE)*1.3)v=(c.p||FAC_PRICE)/10000+10+(c.t==='city'?lineCells(c.line).filter(x=>x.owner===p.id).length*15:0);
    else if(canBuild(p,c)&&p.cash>buildCost(p,c)*1.5)v=c.p/10000+5;
    else if(c.t==='fund')v=G.fund/10000;
    else if(c.t==='kird'&&owned(p).some(x=>canBuild(p,x)))v=14;
    else if(i===0)v=8;
    if(v>bv){bv=v;best=i}});
  return best;
}
function buildOptions(p,c){
  const opts=[];let lv=c.level,sum=0;
  while(lv<4){if(lv===3&&!canLandmark(p,c))break;const t=Object.assign({},c,{level:lv});sum+=Math.round(c.p*BUILD[lv+1]*(p.ch.id==='budget'?.9:1));lv++;if(sum>p.cash)break;opts.push({lv,cost:sum,toll:Math.round(c.p*RATE[lv])})}
  return opts;
}
async function buildFlow(p,c){
  const opts=buildOptions(p,c);if(!opts.length)return;
  const pick=await decide(p,'build',{cell:c,opts});
  const o=opts.find(x=>x.lv===pick);if(!o)return;
  p.cash-=o.cost;c.invested+=o.cost;const from=c.level;c.level=o.lv;
  say(`${p.ch.name}, ${c.n}에 ${LV[o.lv]}${o.lv-from>1?`까지 ${o.lv-from}단계`:''} 건설 ${fmtA(o.cost)}`);
}
async function payTo(p,amt,to,why){
  amt=Math.round(amt);if(amt<=0)return true;
  if(p.cash<amt)await liquidate(p,amt);
  if(p.cash<amt){if(to)to.cash+=p.cash;p.cash=0;bankrupt(p,why);return false}
  p.cash-=amt;if(to)to.cash+=amt;return true;
}
async function liquidate(p,need){
  const list=owned(p).sort((a,b)=>a.invested-b.invested);
  for(const c of list){if(p.cash>=need)break;const v=Math.round(c.invested*.5);p.cash+=v;say(`${p.ch.name}, 자금이 모자라 ${c.n}을(를) ${fmtA(v)}에 매각`);c.owner=-1;c.level=0;c.invested=0;if(G.cells.indexOf(c)===G.festa)G.festa=-1;HOOK.render()}
}
function bankrupt(p,why){
  p.out=true;owned(p).forEach(c=>{c.owner=-1;c.level=0;c.invested=0});
  say(`${p.ch.name} 파산${why?` (${why})`:''}`);

}
function addFund(p,f){G.fund+=f;G.visionTotal+=f;p.contrib+=f;checkVision()}
async function payToll(p,c){
  const o=G.players[c.owner];const t=tollOf(c,p);
  if(p.shield>0){p.shield--;say(`${p.ch.name}, 리더 과정 방패로 통행료 ${fmtA(t)} 면제`);return}
  const f=Math.round(t*FUND_RATE);
  if(p.cash<t)await liquidate(p,t);
  if(p.cash<t){o.cash+=p.cash;p.cash=0;bankrupt(p,`${c.n} 통행료 ${fmtA(t)}`);return}
  p.cash-=t;o.cash+=t-f;
  say(`${p.ch.name} → ${o.ch.name} 통행료 ${fmtA(t)} (인재기금 ${fmtA(f)})`);
  addFund(p,f);
}
function checkVision(){
  if(!G.visionDone&&G.visionTotal>=VISION_GOAL){G.visionDone=true;alivePlayers().forEach(q=>q.cash+=VISION_BONUS);say(`미래비전 게이지 달성! 모두에게 비전 보너스 ${fmtA(VISION_BONUS)}`)}
}
function checkWin(p){
  if(G.over||p.out)return;
  const done=Object.keys(LINES).filter(L=>lineDone(+L,p.id));
  if(done.length>=TRIPLE_WIN){endGame(p,`트리플 독점 · ${done.map(L=>LINES[L].n).join(', ')}`);return}
  for(const [k,[a,b]] of Object.entries(SIDES)){const cs=G.cells.slice(a,b+1).filter(c=>c.t==='city');if(cs.every(c=>c.owner===p.id)){endGame(p,`변 독점 · ${SIDE_NAME[k]}`);return}}
  if(G.cells.filter(c=>c.t==='fac').every(c=>c.owner===p.id))endGame(p,'국가 연구시설 4곳 독점');
}
function standings(){
  const top=Math.max(...G.players.map(p=>p.contrib));
  return G.players.map(p=>{const a=assets(p);const award=!p.out&&p.contrib===top&&top>0;return{p,a,award,score:p.out?-1:Math.round(a*(award?1.05:1))}}).sort((x,y)=>y.score-x.score);
}

async function moveSteps(p,n,dir=1){
  for(let k=0;k<n;k++){p.pos=(p.pos+dir+N)%N;if(dir>0&&p.pos===0)await passStart(p);await HOOK.step(p,n-k-1)}
}
async function moveTo(p,target){await moveSteps(p,(target-p.pos+N)%N)}
async function passStart(p){
  p.laps++;let s=SALARY;if(p.ch.id==='kclub')s+=50000;
  const al=alivePlayers();if(al.length>1){const min=Math.min(...al.map(assets));if(assets(p)===min)s+=SALARY}
  p.cash+=s;say(`${p.ch.name}, 출발점 통과 연구지원금 ${fmtA(s)}`);
}
function goSafety(p){
  if(p.exempt>0){p.exempt--;say(`${p.ch.name}, 안전 면제권 사용`);return false}
  p.pos=SAFETY;p.jail=p.ch.id==='safe'?1:2;say(`${p.ch.name}, 연구실 안전점검 (${p.jail}턴)`);return true;
}
async function drawCard(){if(!G.deck.length)G.deck=shuffleArr(CARDS.slice());return G.deck.pop()}
async function freeBuild(p,why){
  const cands=G.cells.map((c,i)=>i).filter(i=>canBuild(p,G.cells[i]));
  if(!cands.length)return false;
  const i=await decide(p,'pickOwn',{cells:cands,mode:'build',title:`${why}: 무료로 지을 도시를 고르세요`});
  const c=G.cells[i];c.invested+=buildCost(p,c);c.level++;say(`${p.ch.name}, ${why}로 ${c.n}에 ${LV[c.level]} 무료 건설`);checkWin(p);return true;
}
async function useCard(p,card){
  if(card.k==='ox'||card.k==='safe'){
    const ans=await decide(p,'quiz',card);const right=ans===card.a;
    await HOOK.show(p,card,{answered:true,right,ans});
    if(right){const r=(card.k==='ox'?100000:50000)*(p.ch.id==='alpha'?2:1);p.cash+=r;p.quizOK++;if(card.k==='safe')p.exempt++;say(`${p.ch.name}, ${card.t} 정답! +${fmtA(r)}${card.k==='safe'?' · 안전 면제권':''}`)}
    else say(`${p.ch.name}, ${card.t} 오답 (벌칙 없음)`);
    return null;
  }
  await HOOK.show(p,card,{});
  switch(card.fx){
    case'money':if(card.v>0){p.cash+=card.v;say(`${p.ch.name}, ${card.t} +${fmtA(card.v)}`)}else{say(`${p.ch.name}, ${card.t} ${fmtA(card.v)}`);await payTo(p,-card.v,null,card.t)}break;
    case'allbank':alivePlayers().forEach(q=>q.cash+=card.v);say(`${card.t}: 모두 +${fmtA(card.v)}`);break;
    case'move':say(`${p.ch.name}, ${card.t}: ${G.cells[card.v].n}(으)로 이동`);await moveTo(p,card.v);return await landOn(p);
    case'choose':{const t=await decide(p,'choose',{});say(`${p.ch.name}, ${G.cells[t].n}(으)로 이동`);await moveTo(p,t);return await landOn(p)}
    case'jail':goSafety(p);break;
    case'shield':p.shield++;say(`${p.ch.name}, 통행료 면제 방패 획득`);break;
    case'freebuild':if(!await freeBuild(p,'멘토링'))say(`${p.ch.name}, 지을 도시가 없어 효과 없음`);break;
    case'tax':{const n=owned(p).reduce((s,c)=>s+c.level,0);const t=n*card.v;say(`${p.ch.name}, 연구장비 교체 ${fmtA(t)}`);await payTo(p,t,null,card.t);break}
    case'collect':for(const q of alivePlayers()){if(q!==p)await payTo(q,card.v,p,card.t)}say(`${p.ch.name}, 공동연구 성사! 모두에게서 ${fmtA(card.v)}씩`);break;
    case'payall':for(const q of alivePlayers()){if(q!==p&&!p.out)await payTo(p,card.v,q,card.t)}say(`${p.ch.name}, 워크숍 비용 ${fmtA(card.v)}씩 지불`);break;
  }
  return null;
}
async function landOn(p,depth=0){
  const c=G.cells[p.pos];HOOK.render();
  if(depth>3)return null;
  await HOOK.landed(p,c);
  if(c.t==='city'||c.t==='fac'){
    if(c.owner===-1){
      const cost=c.t==='fac'?FAC_PRICE:priceOf(p,c);
      if(p.cash>=cost&&await decide(p,'buy',{cell:c,cost})){p.cash-=cost;c.owner=p.id;c.invested=cost;c.buyLap=p.laps;c.level=0;say(`${p.ch.name}, ${c.full||c.n} 구입 ${fmtA(cost)}`);
        if(c.t==='city'){checkWin(p);if(G.over)return null;await buildFlow(p,c)}}
    }else if(c.owner===p.id){
      if(canBuild(p,c))await buildFlow(p,c);
    }else{
      await payToll(p,c);
      const o=G.players[c.owner];
      if(!p.out&&c.t==='city'&&c.level<4&&o.ch.id!=='notri'){
        const cost=takeoverCost(p,c);
        if(p.cash>=cost&&await decide(p,'takeover',{cell:c,cost,owner:o})){p.cash-=cost;o.cash+=cost;c.owner=p.id;c.buyLap=p.laps;say(`${p.ch.name}, ${o.ch.name}의 ${c.n} 기술이전 ${fmtA(cost)}`)}
      }
    }
  }else if(c.t==='key'){
    let card=await drawCard();
    if(p.ch.id==='davin'){const c2=await drawCard();const pick=await decide(p,'card2',[card,c2]);const other=pick?card:c2;card=pick?c2:card;G.deck.unshift(other)}
    const r=await useCard(p,card);HOOK.render();checkWin(p);return r;
  }else if(c.t==='safety'){goSafety(p)}
  else if(c.t==='fund'){if(G.fund>0){p.cash+=G.fund;say(`${p.ch.name}, 인재기금 ${fmtA(G.fund)} 수령`);G.fund=0}else say(`${p.ch.name}, 인재기금이 비어 있음`)}
  else if(c.t==='reward'){p.cash+=REWARD;say(`${p.ch.name}, 기술료 수입 +${fmtA(REWARD)}`)}
  else if(c.t==='donate'){const ok=await payTo(p,DONATE,null,'기금 기부');if(ok){say(`${p.ch.name}, 인재기금에 ${fmtA(DONATE)} 기부`);addFund(p,DONATE)}}
  else if(c.t==='boost'){say(`${p.ch.name}, 부스터! ${BOOST}칸 더 전진`);await moveSteps(p,BOOST);return await landOn(p,depth+1)}
  else if(c.t==='back'){say(`${p.ch.name}, 재실험! ${BACK}칸 뒤로`);await moveSteps(p,BACK,-1);return await landOn(p,depth+1)}
  else if(c.t==='festa'){const cands=G.cells.map((x,i)=>i).filter(i=>G.cells[i].t==='city'&&G.cells[i].owner===p.id);
    if(cands.length){const i=await decide(p,'pickOwn',{cells:cands,mode:'festa',title:'사이언스 페스타: 통행료 2배로 만들 내 도시를 고르세요'});G.festa=i;say(`${p.ch.name}, 사이언스 페스타 개최! ${G.cells[i].n} 통행료 2배`)}
    else say(`${p.ch.name}, 페스타를 열 도시가 없음`)}
  else if(c.t==='kird'){if(!await freeBuild(p,'KIRD 교육 이수')){p.cash+=KIRD_AID;say(`${p.ch.name}, KIRD 교육지원금 +${fmtA(KIRD_AID)}`)}}
  else if(c.t==='nuri'){const t=await decide(p,'choose',{});say(`${p.ch.name}, 누리호 발사! ${G.cells[t].n}(으)로`);await moveTo(p,t);const ex=await landOn(p,depth+1);return p.ch.id==='strat'?'again':ex}
  HOOK.render();checkWin(p);return null;
}
async function rollDice(){const a=1+(Math.random()*6|0),b=1+(Math.random()*6|0);G.lastDice=[a,b];await HOOK.dice(a,b);return[a,b]}
async function takeTurn(p){
  if(p.jail>0){
    const how=await decide(p,'jail',{});
    if(how==='quiz'){const card=CARDS.filter(c=>c.k==='safe')[Math.random()*4|0];const ans=await decide(p,'quiz',card);const right=ans===card.a;await HOOK.show(p,card,{answered:true,right,ans,jail:true});
      if(right){p.jail=0;say(`${p.ch.name}, 안전 퀴즈 정답으로 점검 통과`)}else{p.jail--;say(`${p.ch.name}, 안전점검 계속 (남은 ${p.jail}턴)`);HOOK.render();return}}
    else{p.jail--;say(`${p.ch.name}, 안전점검 중 (남은 ${p.jail}턴)`);HOOK.render();return}
  }
  let doubles=0,bonus=false;
  while(!G.over&&!p.out){
    await HOOK.beforeRoll(p);
    await decide(p,'roll',{});
    const [a,b]=await rollDice();const dbl=a===b;
    if(dbl)doubles++;
    if(doubles===3){say(`${p.ch.name}, 더블 3번! 과로 경고`);goSafety(p);HOOK.render();break}
    say(`${p.ch.name} 주사위 ${a}+${b}=${a+b}${dbl?' 더블!':''}`);
    await moveSteps(p,a+b);
    const r=await landOn(p);
    if(G.over||p.out||p.jail>0)break;
    if(r==='again'&&!bonus){bonus=true;say(`${p.ch.name}, 전략이 능력으로 한 번 더`);continue}
    if(!dbl)break;
  }
  HOOK.render();
}
async function runGame(){
  while(!G.over){
    const p=G.players[G.turn];
    if(!p.out)await takeTurn(p);
    if(G.over)break;
    let n=G.turn;do{n=(n+1)%G.players.length}while(G.players[n].out);
    if(n<=G.turn)G.round++;
    G.turn=n;
    if(G.round>MAX_ROUND){const t=standings();endGame(t[0].p,`${MAX_ROUND}라운드 종료 · 총자산 1위`);break}
    HOOK.render();
  }
}

function gridPos(i){if(i===0)return[9,15];if(i<14)return[9,15-i];if(i===14)return[9,1];if(i<22)return[9-(i-14),1];if(i===22)return[1,1];if(i<36)return[1,i-21];if(i===36)return[1,15];return[i-35,15]}
function sideOf(i){if(i===0||i===14||i===22||i===36)return'corner';if(i<14)return'bottom';if(i<22)return'left';if(i<36)return'top';return'right'}
function dieSVG(n,spin){const P={1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,26],[72,26],[28,50],[72,50],[28,74],[72,74]]}[n];
  return`<svg class="die${spin?' spin':''}" viewBox="0 0 100 100" role="img" aria-label="주사위 ${n}"><rect x="4" y="4" width="92" height="92" rx="18" fill="#fff" stroke="#0E2238" stroke-width="4"/>${P.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9" fill="${n===1?'#E0533F':'#0E2238'}"/>`).join('')}</svg>`}
const human=()=>G&&G.players.find(p=>p.human);

/* ---------- 보드 ---------- */
function cellSub(c,i){
  if(c.t==='city')return c.owner>=0?`${LV_SHORT[c.level]} ${fmtA(tollOf(c))}`:fmtA(c.p);
  if(c.t==='fac')return c.owner>=0?`통행 ${fmtA(tollOf(c))}`:'연구시설';
  return {start:`+${fmtA(SALARY)}`,fund:fmtA(G.fund),safety:'2턴 휴식',nuri:'원하는 칸',key:'카드',boost:`+${BOOST}칸`,back:`-${BACK}칸`,reward:`+${fmtA(REWARD)}`,donate:`-${fmtA(DONATE)}`,festa:'통행료 2배',kird:'무료 건설'}[c.t]||'';
}
function renderBoard(){
  if(!G)return;
  let h='';
  G.cells.forEach((c,i)=>{
    const [r,col]=gridPos(i);const side=sideOf(i);
    const sp=['boost','back','reward','donate','festa'].includes(c.t);
    const mk=marks.get(i);
    const cls=['cell',side,c.t==='city'?'city':'',c.t==='key'?'key':'',c.t==='fac'?'fac':'',sp?'sp':'',c.t==='kird'?'kird':'',side==='corner'?'corner':'',c.owner>=0?'own':'',trail.has(i)?'trail':'',mk?'marked':'',choosing?(choosing.ok(i)?'choose':'nochoose'):''].join(' ');
    const lc=c.t==='city'?`var(--l${c.line})`:c.t==='fac'?'var(--fac)':'transparent';
    const oc=c.owner>=0?SEAT_COL[c.owner]:'transparent';
    const lv=c.owner>=0&&c.t==='city'?`<span class="lv">${c.level===4?'<i class="lm"></i>':''}${'<i></i>'.repeat(Math.min(c.level,3))}</span>`:'';
    const tag=G.festa===i?'<span class="tag">2×</span>':(c.t==='city'&&c.owner>=0&&lineDone(c.line,c.owner)?'<span class="tag">독점</span>':'');
    const m=mk?`<span class="mk" style="--mc:${mk.col}">${mk.s}</span>`:'';
    h+=`<button type="button" class="${cls}" data-i="${i}" style="grid-row:${r};grid-column:${col};--lc:${lc};--oc:${oc};${mk?`--mc:${mk.col}`:''}" aria-label="${esc(c.full||c.n)}${c.owner>=0?`, ${esc(G.players[c.owner].ch.name)} 소유`:''}"><span class="band"></span>${iconSVG(c)}<span class="nm">${esc(c.n)}</span><span class="sub num">${cellSub(c,i)}</span>${lv}${tag}${m}</button>`;
  });
  const pct=Math.min(100,G.visionTotal/VISION_GOAL*100);const f=FACTS[factI];
  h+=`<div class="center"><div class="cl"><div class="ctitle">알파 <em>마블</em></div>
   <div class="gauge"><div class="lab"><span>미래비전 게이지${G.visionDone?' · 달성!':''}</span><span class="num">${fmtA(G.visionTotal)} / ${fmtA(VISION_GOAL)}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
   <div class="score" id="score"></div>
   <div class="fact"><b>KIRD 한 장 · ${esc(f[0])}</b> ${esc(f[1])}${G.festa>=0?`<br><b>사이언스 페스타</b> ${esc(G.cells[G.festa].n)} 통행료 2배`:''}</div></div>
   <div class="cr" id="crHost"></div></div>`;
  $('board').innerHTML=h;
  renderScore();renderCtrl();
  $('roundPill').innerHTML=`라운드 <b>${Math.min(G.round,MAX_ROUND)}</b>/${MAX_ROUND}`;
  $('fundPill').innerHTML=`인재기금 <b>${fmtA(G.fund)}</b>`;
}
function renderScore(){
  const el=$('score');if(!el||!G)return;
  el.innerHTML=G.players.map(p=>`<div class="sc ${G.players[G.turn]===p&&!G.over?'turn':''} ${p.out?'out':''}" style="--pc:${SEAT_COL[p.id]}"><span class="av">${avatar(p.ch)}</span><b>${esc(p.ch.name)}${p.human?' (나)':''}</b>${p.jail?`<span class="st">점검 ${p.jail}</span>`:''}<span class="m num">${p.out?'파산':fmtA(p.cash)}</span></div>`).join('');
}
function renderPlayers(){
  if(!G)return;
  $('players').innerHTML=G.players.map(p=>{
    const groups=Object.keys(LINES).filter(L=>lineDone(+L,p.id)).length;
    const bd=[p.jail>0?`<span class="bd w">안전점검 ${p.jail}턴</span>`:'',p.shield?`<span class="bd g">방패 ${p.shield}</span>`:'',p.exempt?`<span class="bd g">안전 면제권 ${p.exempt}</span>`:'',groups?`<span class="bd g">색 독점 ${groups}</span>`:'',p.out?'<span class="bd w">파산</span>':''].join('');
    return`<div class="pcard ${G.players[G.turn]===p&&!G.over?'turn':''} ${p.out?'out':''}" style="--pc:${SEAT_COL[p.id]}"><div class="av">${avatar(p.ch)}</div><div style="min-width:0"><b>${esc(p.ch.name)}${p.human?' (나)':''}</b><div class="meta">${esc(ABIL[p.ch.id])}</div><div class="meta">땅 ${owned(p).length}곳 · 기금 기여 ${fmtA(p.contrib)}</div><div class="badges">${bd}</div></div><div class="cash num">${fmtA(p.cash)}<small>총자산 ${fmtA(assets(p))}</small></div></div>`}).join('');

function buildTokens(){
  $('tokens').innerHTML=G.players.map(p=>`<div class="tk" id="tk${p.id}" style="--pc:${SEAT_COL[p.id]}"><div class="body">${avatar(p.ch)}</div><span class="left num"></span></div>`).join('');
}
function cellCenter(i){const el=$('board').querySelector(`[data-i="${i}"]`);if(!el)return[0,0,40];return[el.offsetLeft+el.offsetWidth/2,el.offsetTop+el.offsetHeight/2,Math.min(el.offsetWidth,el.offsetHeight)]}
function placeTokens(anim,hopId){
  if(!G)return;
  const tl=$('tokens');const [, ,cw]=cellCenter(1);const ts=Math.max(16,Math.min(32,cw*.4));
  tl.style.setProperty('--ts',ts+'px');tl.style.setProperty('--tt',anim?Math.min(.32,SP().step/1000*.85)+'s':'0s');
  G.players.forEach(p=>{
    const t=$('tk'+p.id);if(!t)return;t.hidden=p.out;if(p.out)return;
    const same=G.players.filter(q=>!q.out&&q.pos===p.pos);const k=same.indexOf(p);
    const [x,y]=cellCenter(p.pos);const dx=(k-(same.length-1)/2)*ts*.55,dy=(k-(same.length-1)/2)*ts*.18;
    t.style.transform=`translate(${x+dx}px,${y+dy+cw*.2}px)`;
    t.classList.toggle('active',p.id===activeTok);
    if(hopId===p.id){t.classList.remove('hop');void t.offsetWidth;t.classList.add('hop')}
  });
}
window.addEventListener('resize',()=>placeTokens(false));
function follow(i){
  if(!mq.matches)return;const sc=$('scroller');const [x]=cellCenter(i);const beh=REC.speed==='fast'?'auto':'smooth';
  sc.scrollTo({left:Math.max(0,x-sc.clientWidth/2+16),behavior:beh});
  const el=$('board').querySelector(`[data-i="${i}"]`);if(!el)return;const r=el.getBoundingClientRect();const lim=innerHeight-$('dock').offsetHeight-8;
  if(r.bottom>lim)window.scrollBy({top:r.bottom-lim,behavior:beh});else if(r.top<8)window.scrollBy({top:r.top-8,behavior:beh});
}
function setLeft(p,n){const t=$('tk'+p.id);if(t)t.querySelector('.left').textContent=n>0?n:''}
async function banner(big,small,col){

function noticeHTML(){
  if(!notice)return'';const {p,fc}=notice;const me=human();
  const rows=fc.top.map(o=>{
    const mine=me&&o.cell.owner===me.id&&!p.human&&o.kind==='toll';
    const col=mine?MCOL.mine:(MCOL[o.kind]||MCOL.key);
    const lab=mine?`내 땅! 통행료 수입 ${fmtA(-o.amt)}`:o.label;
    return`<div class="nr ${hitSum===o.s?'hit':''}"><span class="s" style="--mc:${col}">${o.s}</span><span class="w">${esc(o.cell.n)}<small>${esc(lab)}</small></span><span class="p num">${Math.round(o.prob*100)}%</span></div>`}).join('');
  const r=Math.round(fc.risk*100);
  return`<h5>${p.human?'주사위 예보':`${esc(p.ch.name)}의 예보`} · 12칸 안 주요 지점</h5>${rows}<div class="risk ${r?'':'ok'}">${p.human?'남의 땅에 걸릴 확률':'통행료 낼 확률'} ${r}%${r?'':' · 안전 구간'}</div>`;
}
function renderCtrl(){
  const host=mq.matches?$('dock'):$('crHost');if(!host)return;

  if(ctrl.bind)ctrl.bind(host.querySelector('#prompt'));
}

function clearPrompt(){ctrl.prompt='';ctrl.bind=null}
function askButtons(title,text,buttons){

    setPrompt(`<h4>${title}</h4>${text?`<p>${text}</p>`:''}<div class="row">${buttons.map((b,i)=>`<button type="button" class="btn ${b.cls||''}" data-i="${i}">${b.label}</button>`).join('')}</div>`,
      el=>{el.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{clearPrompt();renderCtrl();res(buttons[+btn.dataset.i].v)})});
  });

const HUMAN_ASK=async(p,kind,ctx)=>{
  if(kind==='roll')return askButtons('내 차례','예보를 확인하고 굴리세요.',[{label:'주사위 굴리기',v:true,cls:'lime big'}]);
  if(kind==='buy'){const c=ctx.cell;return askButtons(`${esc(c.full||c.n)} 구입?`,`가격 ${fmtA(ctx.cost)} · 보유 ${fmtA(p.cash)}${c.biz?`<br>${esc(c.biz)}`:''}`,[{label:'구입',v:true},{label:'패스',v:false,cls:'dark'}])}
  if(kind==='build'){const c=ctx.cell;return askButtons(`${esc(c.n)}에 건설`,`지금 통행료 ${fmtA(tollOf(c))}. 여러 단계를 한 번에 지을 수 있어요.`,[...ctx.opts.map(o=>({label:`${LV[o.lv]}까지<small>${fmtA(o.cost)} · 통행 ${fmtA(o.toll)}</small>`,v:o.lv})),{label:'안 짓기',v:0,cls:'dark'}])}
  if(kind==='takeover'){const c=ctx.cell;return askButtons(`${esc(c.n)} 기술이전(인수)?`,`${esc(ctx.owner.ch.name)}에게 ${fmtA(ctx.cost)}를 주고 땅과 건물을 가져옵니다. 보유 ${fmtA(p.cash)}`,[{label:'기술이전',v:true,cls:'blue'},{label:'패스',v:false,cls:'dark'}])}
  if(kind==='jail')return askButtons('연구실 안전점검 중',`남은 ${p.jail}턴. 안전 퀴즈를 맞히면 바로 출발합니다.`,[{label:'안전 퀴즈 도전',v:'quiz',cls:'lime'},{label:'쉬기',v:'wait',cls:'dark'}]);

const ABORT=new Error('aborted');const guard=g=>{if(G!==g)throw ABORT};
HOOK.render=()=>{renderBoard();renderPlayers();placeTokens(false)};
HOOK.log=msg=>{const ol=$('log');const li=document.createElement('li');li.textContent=msg;ol.prepend(li);while(ol.children.length>80)ol.lastChild.remove();if(G){G.msg=msg;ctrl.msg=msg;const m=document.querySelector('.cmsg');if(m)m.textContent=msg;renderScore()}};
HOOK.beforeRoll=async p=>{
  const g=G;trail=new Set();hitSum=0;activeTok=p.id;ctrl.tot='';
  notice={p,fc:forecast(p)};
  marks=new Map(notice.fc.top.map(o=>{const me=human();const mine=me&&o.cell.owner===me.id&&!p.human&&o.kind==='toll';return[o.i,{s:o.s,col:mine?MCOL.mine:(MCOL[o.kind]||MCOL.key),kind:o.kind}]}));
  ctrl.msg=p.human?'내 차례입니다.':`${p.ch.name}의 차례`;
  renderBoard();renderPlayers();placeTokens(false);follow(p.pos);
  if(!p.human){await sleep(SP().look);guard(g)}
};
HOOK.dice=async(a,b)=>{
  const g=G;const [n,ms]=SP().dice;ctrl.spin=true;ctrl.tot='';
  for(let k=0;k<n;k++){ctrl.dice=[1+(Math.random()*6|0),1+(Math.random()*6|0)];renderCtrl();await sleep(ms);guard(g)}
  ctrl.spin=false;ctrl.dice=[a,b];hitSum=a+b;ctrl.tot=`${a+b}${a===b?'<small>더블!</small>':''}`;renderCtrl();
  factI=(factI+1)%FACTS.length;await sleep(SP().step*1.6);guard(g);
};
HOOK.step=async(p,left)=>{
  const g=G;trail.add(p.pos);
  const el=$('board').querySelector(`[data-i="${p.pos}"]`);if(el)el.classList.add('trail');
  setLeft(p,left);placeTokens(true,p.id);follow(p.pos);
  await sleep(SP().step);guard(g);
  if(left===0)setLeft(p,0);
};
HOOK.landed=async(p,c)=>{
  const g=G;const me=human();const i=G.cells.indexOf(c);const mk=marks.get(i);
  let big='',small='',col='';
  if((c.t==='city'||c.t==='fac')&&c.owner>=0&&c.owner!==p.id){
    const t=tollOf(c,p);
    if(me&&c.owner===me.id){big='내 땅에 걸렸다!';small=`${p.ch.name} → 통행료 ${fmtA(t)}`;col='#FFD24A'}
    else if(p.human){big='걸렸다!';small=`${c.n} 통행료 ${fmtA(t)}`;col='#E0533F'}
    else{big=`${c.n}`;small=`${p.ch.name} → ${G.players[c.owner].ch.name} 통행료 ${fmtA(t)}`;col='#F08A24'}
  }else if(['boost','back','reward','donate','festa','kird','nuri','fund','safety','key'].includes(c.t)){
    const T={boost:['부스터!','#8CC63F'],back:['재실험','#F08A24'],reward:['기술료 수입!','#8CC63F'],donate:['기금 기부','#F08A24'],festa:['사이언스 페스타','#B07CF2'],kird:['KIRD 교육 이수','#8CC63F'],nuri:['누리호 발사!','#4FA3EA'],fund:['인재기금','#FFD24A'],safety:['안전점검','#E0533F'],key:['알파 키','#4FA3EA']}[c.t];
    big=T[0];small=c.d||'';col=T[1];
  }else if(p.human&&[...trail].some(j=>marks.get(j)&&marks.get(j).kind==='toll'&&j!==i)){big='휴, 피했다!';small='아슬아슬하게 지나갔어요';col='#8CC63F'}
  if(mk&&p.human&&!big){big=c.n;col=mk.col}
  renderPlayers();
  if(big){await banner(big,small,col);guard(g)}
};
HOOK.show=async(p,card,info)=>{
  if(p.human&&!(card.k==='ox'||card.k==='safe')){
    await new Promise(res=>{openModal(`<div class="card">${cardHead(card)}<p style="font-size:16px">${esc(card.d)}</p><button type="button" class="btn" id="cOk">확인</button></div>`,{lock:true});$('cOk').onclick=()=>{closeModal();res()};$('cOk').focus()});
    return;
  }
  if(p.human)return;
  const g=G;const txt=(card.k==='ox'||card.k==='safe')?`${card.t} · ${info.right?'정답':'오답'}`:`${card.t}`;
  await banner(`알파 키 · ${KIND[card.k][0]}`,`${p.ch.name}: ${txt}`,KIND[card.k][1]);guard(g);
};
HOOK.over=o=>{marks=new Map();notice=null;render();setTimeout(()=>showResult(o),500)};

    $('mbox').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{pick=b.dataset.c;draw()});
    $('mbox').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{opp=+b.dataset.o;draw()});
    $('go').onclick=()=>{REC.avatar=pick;REC.opp=opp;saveRec();closeModal();startGame(pick,opp)};
    $('rl').onclick=openRules;$('dx').onclick=openDex;
  };
  draw();
}
$('bNew').onclick=openSetup;
function startGame(av,opp){
  const others=shuffleArr(CHARS.filter(c=>c.id!==av)).slice(0,opp);
  const chars=[CH[av],...others];
  choosing=null;clearPrompt();marks=new Map();trail=new Set();notice=null;hitSum=0;ctrl={dice:[1,1],spin:false,tot:'',msg:'',prompt:'',bind:null};$('log').innerHTML='';
  newGame(chars,0);buildTokens();
  say(`게임 시작! ${chars.map(c=>c.name).join(', ')} · 출발점에서 시계 방향으로`);
  render();
  runGame().catch(e=>{if(e!==ABORT)console.error(e)});
}
openSetup();
