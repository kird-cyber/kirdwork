<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>[시안 J · 나눔 시세판] 관리자 · KIRD 나눔마켓</title>
<link rel="icon" href="assets/k.png">
<link rel="stylesheet" href="assets/app.css?v=5">
<style>
  body { background: #F1F4F8; }
  /* 로그인 */
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(800px 400px at 80% 0%, rgba(141,190,69,.18), transparent 60%), radial-gradient(800px 500px at 0% 100%, rgba(47,132,197,.18), transparent 60%), #F1F4F8; }
  .gate form { width: 400px; max-width: 100%; background: #fff; border-radius: 22px; box-shadow: var(--sh-3); padding: 36px 32px 30px; display: flex; flex-direction: column; gap: 16px; }
  .gate .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
  .gate .brand img { width: 32px; height: 29px; }
  .gate h1 { margin: 6px 0 0; font-size: 24px; letter-spacing: -0.03em; }
  .gate p { margin: -8px 0 4px; color: var(--mute); font-size: 14px; }
  .gate .err { color: var(--bad); font-weight: 600; font-size: 13.5px; min-height: 20px; margin: -6px 0 -6px; }
  /* 틀 */
  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(90deg, #15202B 240px, transparent 240px); }
  .side { background: #15202B; color: #C6D2DF; display: flex; flex-direction: column; padding: 18px 12px; position: sticky; top: 0; height: 100vh; }
  .side .brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 800; font-size: 16.5px; padding: 6px 10px 18px; text-decoration: none; }
  .side .brand img { width: 28px; height: 25px; }
  .side .brand small { display: block; font-size: 11.5px; font-weight: 600; color: #7E90A4; letter-spacing: 0; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button { display: flex; align-items: center; gap: 11px; height: 42px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: inherit; font-weight: 600; font-size: 14.5px; cursor: pointer; text-align: left; }
  .nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav button[aria-current="page"] { background: var(--kird); color: #fff; box-shadow: 0 4px 12px -4px rgba(47,132,197,.7); }
  .nav button .c { margin-left: auto; font-size: 12px; background: rgba(255,255,255,.12); padding: 1px 8px; border-radius: 99px; font-variant-numeric: tabular-nums; }
  .side .foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
  .side .foot a, .side .foot button { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border-radius: 10px; color: #C6D2DF; text-decoration: none; font-size: 13.5px; font-weight: 600; border: 0; background: transparent; cursor: pointer; }
  .side .foot a:hover, .side .foot button:hover { background: rgba(255,255,255,.06); color: #fff; }
  .side .demo { margin: 0 4px 10px; padding: 10px 12px; border-radius: 10px; background: rgba(255,214,107,.12); color: #FFD66B; font-size: 12.5px; line-height: 1.5; }
  .main { min-width: 0; }
  .head { position: sticky; top: 0; z-index: 10; background: rgba(241,244,248,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .head .in { display: flex; align-items: center; gap: 12px; padding: 14px 28px; min-height: 68px; flex-wrap: wrap; }
  .head h1 { margin: 0; font-size: 21px; letter-spacing: -0.03em; }
  .head .sub { color: var(--mute); font-size: 13.5px; }
  .head .act { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 99px; font-size: 13px; font-weight: 700; background: var(--ok-50); color: #0F7A41; }
  .pill.ready { background: var(--kird-50); color: var(--kird-dd); } .pill.paused { background: var(--warn-50); color: #9A5300; } .pill.closed { background: #E4E8EE; color: var(--mute); }
  .content { padding: 24px 28px 80px; display: flex; flex-direction: column; gap: 20px; max-width: 1320px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--sh-1); }
  .panel > .ph { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
  .panel > .ph h2 { margin: 0; font-size: 16px; letter-spacing: -0.02em; }
  .panel > .ph .x { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .panel > .pb { padding: 20px; }
  .panel .scroll { overflow-x: auto; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 16px; box-shadow: var(--sh-1); display: flex; flex-direction: column; gap: 6px; }
  .tile .k { display: flex; align-items: center; gap: 8px; color: var(--mute); font-size: 13px; font-weight: 650; }
  .tile .k i { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-style: normal; }
  .tile .v { font-size: 30px; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .tile .s { font-size: 12.5px; color: var(--mute); }
  .two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .thumb { width: 52px; height: 40px; border-radius: 8px; object-fit: cover; background: #EEF2F6; display: grid; place-items: center; color: #B9C4D0; overflow: hidden; }
  .nm { font-weight: 700; } .nm small { display: block; font-weight: 500; color: var(--mute); font-size: 12.5px; max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tbl tr.hid td { color: var(--faint); } .tbl tr.hid .thumb { opacity: .5; }
  .tbl tr.click { cursor: pointer; }
  .lead-c { font-weight: 800; color: var(--comp-d); }
  .who { display: inline-flex; align-items: center; gap: 6px; font-weight: 650; }
  .who small { color: var(--mute); font-weight: 600; font-size: 12px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar .inp { height: 38px; width: 220px; }
  /* 설정 */
  .set { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px 28px; padding: 22px 22px; border-bottom: 1px solid var(--line-2); }
  .set:last-child { border-bottom: 0; }
  .set > .t h3 { margin: 0 0 4px; font-size: 15px; } .set > .t p { margin: 0; font-size: 13px; color: var(--mute); line-height: 1.55; }
  .set > .f { display: flex; flex-direction: column; gap: 16px; }
  .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .opt { position: relative; display: flex; flex-direction: column; gap: 3px; padding: 13px 14px 13px 42px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; background: #fff; transition: border-color .15s, background .15s; }
  .opt:hover { border-color: #C5D0DC; }
  .opt input { position: absolute; left: 14px; top: 15px; width: 18px; height: 18px; accent-color: var(--kird); margin: 0; }
  .opt b { font-size: 14px; } .opt span { font-size: 12.5px; color: var(--mute); line-height: 1.45; }
  .opt:has(input:checked) { border-color: var(--kird); background: var(--kird-50); }
  .swrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; }
  .swrow b { font-size: 14px; display: block; } .swrow span.d { font-size: 12.5px; color: var(--mute); }
  .preview { background: #F7F9FB; border: 1px dashed #C9D3DE; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; color: var(--ink-2); }
  .preview .h { font-size: 12px; font-weight: 750; color: var(--mute); letter-spacing: .02em; }
  .preview p { margin: 0; line-height: 1.6; } .preview b { color: var(--ink); }
  .savebar { position: sticky; bottom: 16px; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 20px; background: #15202B; color: #fff; border-radius: 14px; box-shadow: var(--sh-3); animation: din .2s; }
  .savebar span { font-weight: 650; } .savebar .btn { margin-left: auto; }
  .danger-zone { display: flex; gap: 10px; flex-wrap: wrap; }
  /* 상품 편집 */
  #itemDlg { width: 980px; }
  .ed { display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
  .ed .l { padding: 26px 28px; display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 110px); overflow-y: auto; }
  .ed .r { padding: 26px 24px; background: #F7F9FB; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 110px); overflow-y: auto; }
  .ed h2 { margin: 0; font-size: 21px; letter-spacing: -0.03em; }
  #itemDlg .foot { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line); background: #fff; border-radius: 0 0 20px 20px; }
  .drop { border: 2px dashed #C3CEDB; border-radius: 14px; padding: 22px 16px; text-align: center; color: var(--mute); background: #fff; cursor: pointer; transition: border-color .15s, background .15s; font-size: 13.5px; }
  .drop:hover, .drop.on { border-color: var(--kird); background: var(--kird-50); color: var(--kird-dd); }
  .drop b { color: var(--ink); display: block; margin: 6px 0 2px; font-size: 14.5px; }
  .phs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .phs .p { position: relative; aspect-ratio: 4/3; border-radius: 10px; overflow: hidden; background: #E9EEF3; border: 1px solid var(--line); }
  .phs .p img { width: 100%; height: 100%; object-fit: cover; }
  .phs .p .cv { position: absolute; left: 6px; top: 6px; background: var(--kird); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
  .phs .p .tools { position: absolute; right: 6px; top: 6px; display: flex; gap: 4px; }
  .phs .p .tools button { width: 28px; height: 28px; border-radius: 8px; border: 0; background: rgba(255,255,255,.95); display: grid; place-items: center; cursor: pointer; box-shadow: var(--sh-1); }
  .phs .p.up { display: grid; place-items: center; }
  .modeNote { font-size: 13px; padding: 10px 12px; border-radius: 10px; }
  .modeNote.comp { background: var(--comp-50); color: #7A3306; } .modeNote.sealed { background: var(--seal-50); color: #2A3188; }
  /* 코드 */
  #codesDlg { width: 760px; }
  .cd { padding: 26px 28px; display: flex; flex-direction: column; gap: 14px; }
  .cd h2 { margin: 0; font-size: 21px; }
  .cd .warn { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--warn-50); color: #7A4200; font-size: 13.5px; font-weight: 600; }
  .cd .list { max-height: 50vh; overflow: auto; border: 1px solid var(--line); border-radius: 12px; }
  .qsm svg { width: 64px; height: 64px; display: block; border-radius: 6px; border: 1px solid var(--line); }
  .qrv { align-items: center; } .qbig svg { width: 260px; height: 260px; display: block; }
  .codev { font: 800 15px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; color: var(--kird-dd); }
  .seg { display: inline-flex; padding: 3px; background: var(--line-2); border-radius: 10px; gap: 2px; }
  .seg button { height: 32px; padding: 0 12px; border: 0; background: transparent; border-radius: 8px; font-weight: 650; font-size: 13.5px; color: var(--mute); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: var(--sh-1); }
  .inl { border: 1px solid transparent; background: transparent; height: 32px; padding: 0 8px; border-radius: 8px; width: 100%; min-width: 120px; }
  .inl:hover { border-color: var(--line); } .inl:focus { outline: none; border-color: var(--kird); background: #fff; }
  #bidsDlg { width: 640px; }
  .log-d { color: var(--mute); font-size: 13px; }
  @media (max-width: 1100px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .two { grid-template-columns: 1fr; } .set { grid-template-columns: 1fr; gap: 12px; } }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; background: none; }
    .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px; padding: 10px; }
    .side .brand { padding: 4px 8px; } .nav { flex-direction: row; flex-wrap: wrap; } .nav button .c { display: none; } .side .foot { margin: 0 0 0 auto; flex-direction: row; } .side .demo { display: none; }
    .ed { grid-template-columns: 1fr; } .ed .r { border-left: 0; border-top: 1px solid var(--line); }
    .content, .head .in { padding-left: 14px; padding-right: 14px; } .row2 { grid-template-columns: 1fr; }
  }

  /* v2: 좁은 휴대폰(360px)에서 표가 화면 밖으로 밀리던 문제 · iOS 입력 확대 */
  .main, .content, .panel, .two > *, .tiles > * { min-width: 0; }
  .panel .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  @media (max-width: 640px) { .inp, select.inp, textarea.inp { font-size: 16px; } .content, .head .in { padding-left: 12px; padding-right: 12px; } .tiles { grid-template-columns: 1fr 1fr; gap: 8px; } }
</style>
</head>
<body>
<div id="gate" class="gate" hidden>
  <form id="gateForm">
    <div class="brand"><img src="assets/kmark.png" alt="">KIRD 나눔마켓</div>
    <h1>관리자 로그인</h1>
    <p>행사 담당자만 들어올 수 있어요.</p>
    <div class="field"><label for="pw">관리자 비밀번호</label><input class="inp" id="pw" type="password" autocomplete="current-password" required></div>
    <div class="err" id="gateErr" role="alert"></div>
    <button class="btn primary lg block" type="submit" id="gateBtn">들어가기</button>
    <a href="./" style="text-align:center;font-size:13.5px;color:var(--mute)">← 직원 입찰 화면으로</a>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <a class="brand" href="./" target="_blank" rel="noopener"><img src="assets/kmark.png" alt=""><span>나눔마켓<small>관리자</small></span></a>
    <nav class="nav" id="nav">
      <button data-p="dash"><span data-ic="dash"></span>한눈에 보기</button>
      <button data-p="items"><span data-ic="box"></span>상품 관리<span class="c" data-n="items"></span></button>
      <button data-p="codes"><span data-ic="ticket"></span>참가 코드<span class="c" data-n="codes"></span></button>
      <button data-p="results"><span data-ic="trophy"></span>입찰 현황·결과</button>
      <button data-p="settings"><span data-ic="gear"></span>입찰 규칙·설정</button>
      <button data-p="logs"><span data-ic="history"></span>기록</button>
    </nav>
    <div class="foot">
      <div class="demo" id="sideDemo" hidden><b>데모 모드</b> · 이 브라우저에만 저장돼요. 입찰 화면을 다른 탭에 열어 두면 함께 바뀌어요.</div>
      <a href="./" target="_blank" rel="noopener"><span data-ic="ext"></span>직원 화면 열기</a>
      <button id="logout"><span data-ic="logout"></span>로그아웃</button>
    </div>
  </aside>
  <div class="main">
    <header class="head"><div class="in">
      <div><h1 id="pTitle">한눈에 보기</h1><div class="sub" id="pSub"></div></div>
      <div class="act"><span class="pill" id="pill"></span><button class="btn sm" id="pauseBtn"></button><button class="btn sm ghost" id="reload" title="새로고침"><span data-ic="refresh"></span><span class="sr">새로고침</span></button></div>
    </div></header>
    <div class="content" id="content"></div>
  </div>
</div>

<dialog id="itemDlg" class="dlg" aria-labelledby="edT"></dialog>
<dialog id="codesDlg" class="dlg" aria-labelledby="cdT"></dialog>
<dialog id="bidsDlg" class="dlg" aria-labelledby="bdT"></dialog>

<script src="config.js?v=5"></script>
<script src="assets/core.js?v=5"></script>
<script src="assets/client.js?v=5"></script>
<script src="assets/qr.js?v=5"></script>
<script src="assets/admin.js?v=4"></script>
</body>
</html>
