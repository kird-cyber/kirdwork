<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="KIRD 알파 유니버스 — 명왕성부터 태양까지, 같은 천체를 합쳐 키우는 태양계 합치기 게임">
<link rel="icon" href="../favicon.png?v=2">
<meta name="theme-color" content="#060B18">
<title>KIRD 알파 유니버스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;800;900&display=swap">
<style>
/* 레이아웃: 왼쪽 점수판 · 가운데 그릇(캔버스) · 오른쪽 범례. 휴대폰은 점수판 한 줄 위, 범례 가로 띠 아래. 밤하늘 단일 다크 화면 */
:root{
  --night:#060B18;--ink:#0E2238;--panel:rgba(16,26,48,.88);--line:rgba(255,255,255,.14);
  --blue:#2E86D6;--lime:#8CC63F;--gold:#FFD24A;--paper:#F4F7FB;--mute:#9FB3CC;--red:#E0533F;
  --disp:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;--body:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#1B2F5C 0%,#0B1530 38%,var(--night) 75%) fixed,var(--night);color:#fff;font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:var(--body)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;display:grid;grid-template-columns:220px minmax(0,auto) 250px;gap:18px;justify-content:center;align-items:start;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px;min-height:100%;box-sizing:border-box}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.brand{font-family:var(--disp);font-size:30px;line-height:1;letter-spacing:.01em}
.brand em{font-style:normal;color:var(--gold)}
.brand small{display:block;font-family:var(--body);font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.06em;margin-top:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;backdrop-filter:blur(4px)}
.lab{font-size:12px;font-weight:900;color:var(--mute);letter-spacing:.06em}
.score{font-family:var(--disp);font-size:40px;line-height:1.05;color:#fff}
.best{font-family:var(--disp);font-size:28px;line-height:1.05;color:var(--gold)}
.newrec{display:inline-block;margin-left:6px;font-family:var(--body);font-size:11px;font-weight:900;background:var(--red);color:#fff;border-radius:6px;padding:1px 6px;vertical-align:middle}
.next{display:flex;align-items:center;gap:12px}
.next img{width:64px;height:64px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.next b{font-size:17px}.next small{display:block;color:var(--mute);font-weight:700;font-size:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:9px 10px;font-weight:900;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;color:#fff;border-color:var(--line)}
.btn.full{grid-column:1/-1}
.themes{display:grid;gap:6px}
.th{display:flex;align-items:center;gap:8px;background:transparent;border:2px solid var(--line);border-radius:12px;color:#fff;padding:7px 10px;cursor:pointer;font-weight:800;font-size:13.5px;text-align:left}
.th i{width:18px;height:18px;border-radius:5px;background:var(--tc);flex:none;border:2px solid rgba(255,255,255,.6)}
.th.on{border-color:var(--gold);background:rgba(255,210,74,.12)}
.hint{font-size:12px;color:var(--mute);font-weight:700;line-height:1.55}
.stage{position:relative;min-width:0;display:flex;justify-content:center}
#cv{display:block;touch-action:none;cursor:none;border-radius:6px}
.legend{display:flex;flex-direction:column;gap:2px}
.legend h2{font-family:var(--disp);font-weight:400;font-size:20px;margin:0 0 6px}
.legend h2 small{font-family:var(--body);font-size:11.5px;font-weight:800;color:var(--mute);margin-left:6px}
.lg{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:8px;align-items:center;background:none;border:0;border-radius:10px;padding:3px 6px;color:#fff;cursor:pointer;text-align:left;width:100%}
.lg:hover{background:rgba(255,255,255,.06)}
.lg img{width:34px;height:34px;justify-self:center}
.lg b{font-size:14px;font-weight:900;display:block;line-height:1.2}
.lg small{display:block;font-size:11px;color:var(--mute);font-weight:700;line-height:1.25}
.lg .p{font-size:12px;font-weight:900;color:var(--gold);text-align:right;white-space:nowrap}
.lg .p small{color:var(--mute);font-weight:700}
.lg .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rc);margin-right:5px;vertical-align:1px}
.lg.unseen{opacity:.4}
.lg.unseen img{filter:grayscale(1) brightness(.7)}
.lg.top{background:rgba(255,210,74,.12);box-shadow:inset 0 0 0 2px rgba(255,210,74,.55)}
.lg .arrow{grid-column:1/-1;height:0}
.rank{display:flex;gap:10px;align-items:center;background:none;border:0;color:#fff;padding:0;cursor:pointer;width:100%;text-align:left}
.rank svg{width:56px;height:56px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.rank b{display:block;font-family:var(--disp);font-weight:400;font-size:21px;line-height:1.1;color:var(--rk)}
.rank .tt{display:block;font-size:13px;font-weight:900;color:#fff}
.rank small{display:block;font-size:11px;font-weight:700;color:var(--mute);margin-top:3px}
.rbar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:5px}
.rbar i{display:block;height:100%;background:var(--rk);transition:width .4s}
.promo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:35;text-align:center;pointer-events:none;animation:pr 2.2s ease forwards}
.promo svg{width:120px;height:120px;filter:drop-shadow(0 0 24px var(--rk))}
.promo b{display:block;font-family:var(--disp);font-weight:400;font-size:40px;color:var(--rk);text-shadow:0 3px 0 #0E2238}
.promo small{display:block;font-weight:900;font-size:16px;color:#fff;text-shadow:0 2px 6px #000}
@keyframes pr{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
@media (prefers-reduced-motion:reduce){.promo{animation:none;opacity:1}}
.box .emb svg{width:132px;height:132px;display:block;margin:2px auto 0}
.box .rname{font-family:var(--disp);font-weight:400;font-size:28px;line-height:1.1}
.box .rsub{font-weight:900;color:#3E5878;font-size:14px}
.box .rk-table td:first-child{display:flex;align-items:center;gap:8px}
.box .rk-table svg{width:30px;height:30px}
.ebar{height:12px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0}
.ebar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4FA3EA,#B07CF2);transition:width .25s}
.btn.hole{width:100%;background:#2A1E4A;color:#E7D2FF;border-color:#B07CF2}
.btn.hole small{font-size:11px;opacity:.7;margin-left:4px}
.btn.hole:not(:disabled){background:#B07CF2;color:#0E2238;animation:hp 1s ease-in-out infinite}
.btn.hole:disabled{opacity:.55;cursor:not-allowed}
@keyframes hp{50%{box-shadow:0 0 0 6px rgba(176,124,242,.35)}}
@media (prefers-reduced-motion:reduce){.btn.hole:not(:disabled){animation:none}}
.credit{font-size:10.5px;color:var(--mute);font-weight:600;line-height:1.5}
.credit a{color:#BFD7F2}

#modal{position:fixed;inset:0;z-index:30;background:rgba(3,6,16,.72);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow:auto}
.box{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;width:min(460px,100%);padding:18px 20px 20px;box-shadow:0 20px 50px rgba(0,0,0,.5);max-height:100%;overflow:auto;box-sizing:border-box;text-align:center}
.box h3{font-family:var(--disp);font-weight:400;font-size:30px;margin:4px 0 6px;line-height:1.15}
.box p{font-weight:700;line-height:1.6;margin:6px 0;color:#25344D}
.box .big{font-family:var(--disp);font-size:52px;line-height:1;color:var(--ink)}
.box .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.box .stat{display:flex;justify-content:center;gap:18px;margin:8px 0}
.box .stat div{font-weight:800;color:#3E5878;font-size:13px}.box .stat b{display:block;font-size:20px;color:var(--ink)}
.box img.hero{width:110px;height:110px;margin:4px auto 0;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.box .fact{background:#E9F0FA;border-radius:12px;padding:10px 12px;font-size:13.5px;text-align:left}
.box .fact b{color:#1F6FB2}
.box .x{position:absolute}
.box table{width:100%;border-collapse:collapse;font-size:13.5px;text-align:left;margin-top:8px}
.box td{border-bottom:1px solid #D3DCE8;padding:6px 4px}
.box td:last-child{text-align:right;font-weight:800}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:40;max-width:min(92vw,520px);background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:9px 16px;font-weight:800;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.35);text-align:center}
@media (min-width:900px){#toast{top:auto;left:auto;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:none;max-width:260px;text-align:left}}

@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr);gap:10px;padding-block:8px 16px}
  .side.left{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr) auto;gap:6px;align-items:stretch}
  .next b{white-space:nowrap}.next{gap:6px}
  .side.left .brand{grid-column:1/-1;font-size:22px;display:flex;align-items:baseline;gap:8px}
  .side.left .brand small{margin:0}
  .side.left .card{padding:8px 10px}
  .score{font-size:26px}.best{font-size:22px}
  .next img{width:40px;height:40px}.next b{font-size:14px}.next small{display:none}
  .side.left .hint{display:none}
  .side.left .energyCard{grid-column:1/-1;order:7;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 10px}.energyCard .ebar{margin:0}.energyCard .btn.hole{width:auto;padding:6px 10px;font-size:12.5px}
  .side.left .rankCard{grid-column:1/-1;order:8;padding:6px 10px}.rankCard .lab{display:none}.rank svg{width:40px;height:40px}.rank b{font-size:17px}
  .side.left .themesCard{grid-column:1/-1;order:9;padding:6px 8px}.themesCard .lab{display:none}
  .themes{grid-template-columns:repeat(3,minmax(0,1fr))}.th{font-size:11.5px;padding:5px 6px;gap:5px}.th i{width:12px;height:12px}
  .btns{grid-template-columns:1fr;align-content:center}
  .btns .btn{padding:6px 8px;font-size:12.5px}
  .btns .full{display:none}
  .legend{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .legend h2{display:none}
  .lg{grid-template-columns:1fr;justify-items:center;width:auto;min-width:64px;padding:4px}
  .lg img{width:30px;height:30px}
  .lg b{font-size:11.5px;text-align:center}
  .lg small,.lg .p small{display:none}
  .lg .p{font-size:11px;text-align:center}
  .side.right .card{padding:8px}
}
</style>
</head>
<body>


<canvas id="stars" aria-hidden="true"></canvas>
<div class="app">
  <aside class="side left">
    <div class="brand">알파 <em>유니버스</em><small>KIRD · 태양계 천체 합치기</small></div>
    <div class="card"><div class="lab">현재 점수</div><div class="score num" id="score">0</div></div>
    <div class="card"><div class="lab">최고 점수 · 이 PC <span class="newrec" id="newrec" hidden>신기록</span></div><div class="best num" id="best">0</div></div>
    <div class="card rankCard"><div class="lab" style="margin-bottom:6px">과학기술인 등급</div><button type="button" class="rank" id="rank" aria-label="등급표 보기"></button></div>
    <div class="card energyCard"><div class="lab">알파 에너지 <span id="feverTag" class="newrec" style="background:#7A3FC4" hidden>피버 ×2</span></div><div class="ebar"><i id="ebar"></i></div><button type="button" class="btn hole" id="bHole" disabled>블랙홀 발동 <small>B</small></button></div>
    <div class="card"><div class="lab">다음 천체</div><div class="next" id="next"></div></div>
    <div class="btns"><button class="btn" id="bRestart" type="button">다시 시작</button><button class="btn ghost" id="bSound" type="button">소리 켜기</button><button class="btn ghost full" id="bHow" type="button">하는 법</button><a class="btn ghost full" href="../" style="text-decoration:none;text-align:center">케이요새 광장</a></div>
    <div class="card themesCard"><div class="lab" style="margin-bottom:8px">그릇 테마</div><div class="themes" id="themes"></div></div>
    <p class="hint">마우스로 좌우를 맞추고 클릭, 휴대폰은 끌다가 떼면 떨어집니다. 같은 천체끼리 닿으면 한 단계 큰 천체가 됩니다. 위쪽 선을 넘으면 끝.</p>
  </aside>
  <main class="stage" id="stage"><canvas id="cv" aria-label="알파 유니버스 게임판"></canvas></main>
  <aside class="side right">
    <div class="card legend" id="legend"></div>
    <p class="credit">천체 이미지: NASA 3D Resources(명왕성·금성), <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">Solar System Scope</a> 텍스처(CC BY 4.0, NASA 자료 기반)를 구체로 다시 렌더링.</p>
  </aside>
</div>
<div id="modal" hidden><div class="box" id="mbox"></div></div>
<div id="toast" hidden></div>

<script>
// 그릇 테마별 한 줄 소식 (문구 후보 150선 문서 기준, 2026-10-27)
const TIPS={
kird:[
'KIRD는 과학기술정보통신부 소관 공공기관으로, 오창 본원과 대전교육센터가 있어요.',
"KIRD의 비전은 '과학기술로 여는 내일, 인재가 만드는 미래'예요.",
'KIRD 로고는 사람 인(人)에 새순을 더해, 교육으로 자라는 인재를 뜻해요.',
'KIRD 핵심가치는 전문성, 공감과 협력, 도전과 혁신, 고객성장이에요.',
"KIRD는 2007년 11월 '연구개발인력교육원'으로 출발했어요.",
'2014년 1월, 지금의 이름인 국가과학기술인력개발원이 됐어요.',
'2015년 8월, 충북 청주 오창에 지금의 본원 청사를 지었어요.',
'KIRD는 국내 64개 기관과 협약(MOU)을 맺고 함께 인재를 키워요.',
'2025년 한 해 KIRD 교육 수료생은 355,911명이에요.',
'2025년 수료생은 집합교육 33,310명, 온라인 322,601명이에요.',
'KIRD 수료생은 2023년부터 3년 연속 늘었어요.',
'2025년 KIRD는 집합 365개, 온라인 293개, 모두 658개 과정을 열었어요.',
'2025년 수료생은 출연(연)·공공기관 소속이 187,387명으로 가장 많아요.',
'2025년에는 대학에서도 142,536명이 KIRD 교육을 들었어요.',
'2025년 집합교육 만족도는 5점 만점에 4.69점이에요.',
'이러닝 만족도는 4.35 → 4.42 → 4.50점으로 해마다 올랐어요.',
'알파캠퍼스는 2022년 3월 문을 연 과학기술인 평생 학습플랫폼이에요.',
'알파캠퍼스 누적 회원은 888,424명이에요(2025년).',
"알파캠퍼스 '역량개발 로드맵'은 36개 역량별로 맞는 교육을 보여 줘요.",
'역량 로드맵은 핵심 7개, 직무 17개, 리더십 12개 역량으로 짜여 있어요.',
'알파캠퍼스에서는 전자책 5,800여 권도 읽을 수 있어요.',
'2025년 알파캠퍼스에 네이버·카카오 간편 로그인이 생겼어요.',
'KIRD 학습 여정은 교육탐색 → 역량진단 → 로드맵 → 학습 → 디지털 배지예요.',
"KIRD 디지털 배지는 알파캠퍼스 '배지 지갑'에 차곡차곡 쌓여요.",
'2025년 새 단장한 AI 교육을 듣고 AI 활용 역량이 53.2% 올랐어요.',
'KIRD 생성형 AI 튜터 시범 운영 만족도는 4.54점이었어요.',
'KIRD는 2027년까지 모든 과정에 생성형 AI 튜터를 넣는 게 목표예요.',
'2026년 KIRD는 AI·우주·양자 같은 전략기술 교육도 운영해요.',
'2026년 KIRD 교육은 모두 9개 분야로 나뉘어 있어요.',
'KIRD 교육은 신진·중견·리더 경력단계와 직무에 맞춰 골라 들을 수 있어요.',
'2026년 KIRD 해외연수는 독일·영국·호주 등 8곳에서 열려요.',
"2026년 연구보안 교육에는 'AI 기술과 연구보안'이 더해져요.",
'KIRD 교육은 집합·온라인에 하이플렉스까지, 편한 방식으로 들을 수 있어요.',
'K-클럽 누적 회원은 45,353명, 2년 만에 1.8배가 됐어요.',
"K-클럽 '커리어 살롱'에서 102개 기관 181명이 경력 고민을 나눴어요.",
"'러닝랩'에서는 77개 기관 136명이 20개 랩으로 함께 공부했어요.",
"K-클럽 '과학기술인 라운지'에는 박사후·고경력·해외인력 공간이 있어요.",

const DIVS=['IV','III','II','I'];
function rankOf(sc){
  let i=0;for(let k=0;k<RANKS.length;k++)if(sc>=RANKS[k].min)i=k;
  const R=RANKS[i],hi=i+1<RANKS.length?RANKS[i+1].min:null;let d=-1,label=R.n,next=hi,nextLabel=hi?RANKS[i+1].n:'';
  if(R.div&&hi){const step=(hi-R.min)/4;d=Math.min(3,Math.floor((sc-R.min)/step));label=`${R.n} ${DIVS[d]}`;if(d<3){next=Math.round(R.min+step*(d+1));nextLabel=`${R.n} ${DIVS[d+1]}`}}
  const lo=d>=0?Math.round(R.min+(hi-R.min)/4*d):R.min;const pct=next?Math.min(1,(sc-lo)/(next-lo)):1;
  return{i,d,label,next,nextLabel,pct};
}
